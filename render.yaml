services:
  - type: web
    runtime: node
    name: game-signal-desk
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-5
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SUPABASE_URL
        value: https://qvyquokwbsbvqrkcjcuo.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
