<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게임 동향 시그널 데스크</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#F4F6F9;
    --surface:#FFFFFF;
    --surface-2:#F7F9FB;
    --surface-3:#EEF2F6;
    --border:#E1E7EE;
    --border-strong:#C9D3DE;
    --ink:#17232E;
    --mute:#5E6E7E;
    --mute-2:#93A1AF;
    --accent:#2456E6;
    --accent-soft:#EAF0FE;
    --pos:#0B9E63;
    --pos-soft:#E7F6EF;
    --neg:#D6455D;
    --neg-soft:#FBEDF0;
    --amber:#B7791F;
    --amber-soft:#FBF3E4;
    --font-display:-apple-system,'Apple SD Gothic Neo','Pretendard','Malgun Gothic',sans-serif;
    --font-body:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); line-height:1.55; }
  .app{ padding:20px; max-width:1180px; margin:0 auto; }

  /* ---------- topbar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; margin-bottom:18px;
    background:var(--surface);
    border:1px solid var(--border); border-radius:14px;
    box-shadow:0 1px 3px rgba(23,35,46,0.05);
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .live-dot{ width:10px; height:10px; border-radius:50%; background:var(--pos); animation:pulse 2s infinite; flex:none; }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(11,158,99,0.4); }
    70%{ box-shadow:0 0 0 8px rgba(11,158,99,0); }
    100%{ box-shadow:0 0 0 0 rgba(11,158,99,0); }
  }
  .brand h1{ font-family:var(--font-display); font-size:19px; font-weight:800; margin:0; letter-spacing:-0.01em; }
  .subtitle{ margin:2px 0 0; font-size:12.5px; color:var(--mute); }
  .badge-live{
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.08em; color:var(--pos);
    border:1px solid #BFE5D4; border-radius:20px; padding:5px 12px;
    background:var(--pos-soft); flex:none;
  }

  /* ---------- layout ---------- */
  .layout{ display:grid; grid-template-columns:270px 1fr; gap:18px; align-items:start; }
  @media (max-width:760px){ .layout{ grid-template-columns:1fr; } }

  .archive{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:16px; position:sticky; top:16px; box-shadow:0 1px 3px rgba(23,35,46,0.05);
  }
  .archive-head{
    display:flex; align-items:center; justify-content:space-between; font-size:12px; letter-spacing:0.08em;
    color:var(--mute-2); text-transform:uppercase; margin-bottom:10px; font-family:var(--font-mono);
  }
  .ghost-btn{
    background:none; border:1px solid var(--border-strong); color:var(--ink); border-radius:8px;
    padding:5px 9px; font-size:12px; cursor:pointer; font-family:var(--font-body);
    transition:border-color .15s, color .15s;
  }
  .ghost-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .archive-list{ display:flex; flex-direction:column; gap:8px; max-height:600px; overflow-y:auto; }
  .empty-note{ color:var(--mute-2); font-size:12.5px; margin:6px 2px; }
  .archive-item{
    display:flex; flex-direction:column; gap:3px; padding:10px 11px; background:var(--surface-2);
    border:1px solid var(--border); border-radius:10px; cursor:pointer; text-align:left; width:100%;
    transition:border-color .15s, background .15s;
  }
  .archive-item:hover{ border-color:var(--border-strong); background:var(--surface-3); }
  .archive-item.active{ border-color:var(--accent); background:var(--accent-soft); }
  .archive-item-top{ display:flex; align-items:center; gap:7px; }
  .sentiment-dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .sentiment-dot.긍정적{ background:var(--pos); }
  .sentiment-dot.부정적{ background:var(--neg); }
  .sentiment-dot.혼재{ background:var(--amber); }
  .archive-item-name{ font-size:13px; font-weight:700; color:var(--ink); }
  .archive-item-dev{ font-size:11px; color:var(--mute); }
  .archive-item-date{ font-size:11px; color:var(--mute-2); font-family:var(--font-mono); }
  .archive-item-stage{
    display:inline-block; font-size:10px; font-family:var(--font-mono); padding:1px 6px;
    border-radius:4px; background:var(--amber-soft); color:var(--amber); width:fit-content;
  }

  /* ---------- main / cards ---------- */
  .main{ display:flex; flex-direction:column; gap:18px; }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:22px;
    box-shadow:0 1px 3px rgba(23,35,46,0.05);
  }
  .form-card h2{
    font-family:var(--font-display); font-size:14px; margin:0 0 6px; color:var(--mute);
    text-transform:uppercase; letter-spacing:0.06em;
  }
  .form-hint{ font-size:12px; color:var(--mute-2); margin:0 0 14px; }
  .field-row{ display:grid; grid-template-columns:1fr; gap:14px; margin-bottom:14px; }
  .field-row.two-col{ grid-template-columns:1fr 1fr; }
  @media (max-width:600px){ .field-row.two-col{ grid-template-columns:1fr; } }
  .field-row label, .stage-row label.text-label{ display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--mute); }
  .optional{ color:var(--mute-2); font-weight:400; }
  .field-row input, .stage-row input[type=text]{
    background:var(--surface); border:1px solid var(--border-strong); border-radius:9px; padding:10px 12px;
    color:var(--ink); font-size:14px; font-family:var(--font-body); outline:none; transition:border-color .15s, box-shadow .15s;
  }
  .field-row input:focus, .stage-row input[type=text]:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }

  .stage-row{ margin-bottom:14px; }
  .stage-title{ font-size:12.5px; color:var(--mute); margin-bottom:8px; }
  .radio-group{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .radio-pill{
    display:flex; align-items:center; gap:7px; padding:9px 14px; border:1px solid var(--border-strong);
    border-radius:9px; cursor:pointer; font-size:13.5px; background:var(--surface); transition:all .15s;
  }
  .radio-pill:hover{ border-color:var(--accent); }
  .radio-pill.selected{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:700; }
  .radio-pill input{ accent-color:var(--accent); margin:0; }
  #cbtNameWrap{ max-width:420px; }
  #cbtNameWrap input{ width:100%; }

  .primary-btn{
    background:var(--accent); color:#fff; border:none; border-radius:9px; padding:11px 20px;
    font-size:14px; font-weight:700; cursor:pointer; font-family:var(--font-display);
    letter-spacing:-0.01em; transition:filter .15s, transform .1s;
  }
  .primary-btn:hover{ filter:brightness(1.08); }
  .primary-btn:active{ transform:scale(0.98); }
  .primary-btn:disabled{ opacity:0.55; cursor:default; }

  .status-text{ margin:12px 0 0; font-size:12.5px; color:var(--mute); font-family:var(--font-mono); min-height:16px; }
  .status-text.err{ color:var(--neg); }

  .progress-wrap{ margin-top:14px; }
  .progress-track{ height:8px; border-radius:6px; background:var(--surface-3); overflow:hidden; }
  .progress-fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--accent), var(--pos)); transition:width .3s ease; }
  .progress-label{ display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11.5px; color:var(--mute); margin-top:6px; }
  .progress-label #progressPct{ color:var(--accent); font-weight:700; }

  .hidden{ display:none !important; }

  /* ---------- report ---------- */
  .report-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .report-title{ font-family:var(--font-display); font-size:22px; font-weight:800; margin:0; }
  .report-title small{ display:block; font-size:12.5px; color:var(--mute); font-weight:500; margin-top:3px; }
  .report-meta{ font-size:12px; color:var(--mute-2); font-family:var(--font-mono); margin-top:6px; }
  .action-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .action-btn{
    background:var(--surface); border:1px solid var(--border-strong); color:var(--ink); border-radius:8px;
    padding:8px 13px; font-size:12.5px; cursor:pointer; font-family:var(--font-body); transition:all .15s;
  }
  .action-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .action-btn.saving{ background:var(--pos); border-color:var(--pos); color:#fff; }
  .edit-banner{
    background:var(--amber-soft); border:1px solid #E8D5AC; color:var(--amber);
    border-radius:9px; padding:9px 13px; font-size:12.5px; margin-bottom:14px;
  }

  #reportBody[contenteditable="true"]{ outline:2px dashed var(--amber); outline-offset:8px; border-radius:6px; }

  .section{ margin-bottom:24px; }
  .section:last-child{ margin-bottom:0; }
  .section-label{
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.1em; color:var(--accent);
    text-transform:uppercase; margin:0 0 10px; display:flex; align-items:center; gap:8px;
  }
  .section-label::before{ content:''; width:16px; height:1px; background:var(--accent); }

  .info-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  @media (max-width:600px){ .info-grid{ grid-template-columns:1fr 1fr; } }
  .info-cell{ background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:11px 13px; }
  .info-cell .k{ font-size:11px; color:var(--mute-2); font-family:var(--font-mono); }
  .info-cell .v{ font-size:13.5px; margin-top:3px; font-weight:700; }

  .overview-box{ background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:14px 16px; font-size:13.5px; }

  .feature-list{ display:flex; flex-direction:column; gap:10px; }
  .feature-item{ background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:13px 15px; }
  .feature-item-head{ display:flex; gap:10px; align-items:baseline; margin-bottom:7px; }
  .feature-num{ font-family:var(--font-mono); color:var(--accent); font-size:12px; flex:none; font-weight:700; }
  .feature-item-head b{ font-size:14px; }
  .feature-item ul{ margin:0; padding-left:18px; font-size:13px; color:var(--mute); }
  .feature-item li{ margin-bottom:5px; }
  .feature-item li:last-child{ margin-bottom:0; }

  .quick-tags{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px; }
  .quick-tag{ font-size:12px; padding:5px 10px; border-radius:20px; }
  .quick-tag.pos{ background:var(--pos-soft); color:var(--pos); border:1px solid #BFE5D4; }
  .quick-tag.neg{ background:var(--neg-soft); color:var(--neg); border:1px solid #F0C8D0; }

  .overall-tag{
    display:inline-block; font-size:12px; font-weight:700; padding:3px 10px; border-radius:20px;
    margin-bottom:12px; font-family:var(--font-mono);
  }
  .overall-tag.긍정적{ background:var(--pos-soft); color:var(--pos); border:1px solid #BFE5D4; }
  .overall-tag.부정적{ background:var(--neg-soft); color:var(--neg); border:1px solid #F0C8D0; }
  .overall-tag.혼재{ background:var(--amber-soft); color:var(--amber); border:1px solid #E8D5AC; }

  .detail-list{ display:flex; flex-direction:column; gap:9px; }
  .detail-item{
    display:flex; gap:10px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:10px; padding:12px 14px; position:relative; transition:box-shadow .15s;
  }
  .detail-item.positive{ border-left:3px solid var(--pos); }
  .detail-item.negative{ border-left:3px solid var(--neg); }
  .detail-item.mixed{ border-left:3px solid var(--amber); }
  .detail-item.dragging{ opacity:0.45; box-shadow:0 4px 14px rgba(23,35,46,0.18); }
  .detail-marker{ flex:none; font-size:13px; padding-top:1px; font-weight:700; }
  .detail-marker.positive{ color:var(--pos); }
  .detail-marker.negative{ color:var(--neg); }
  .detail-marker.mixed{ color:var(--amber); }
  .detail-body b{ display:block; font-size:13.5px; margin-bottom:3px; }
  .detail-body span{ font-size:13px; color:var(--mute); }
  .drag-handle{
    flex:none; cursor:grab; color:var(--mute-2); font-size:15px; padding:0 3px;
    user-select:none; align-self:center;
  }
  .drag-handle:active{ cursor:grabbing; }

  .trend-box{ background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:13px 14px; font-size:13.5px; }
  .trend-box ul{ margin:8px 0 0; padding-left:18px; color:var(--mute); font-size:13px; }
  .date-chip{
    display:inline-block; font-family:var(--font-mono); font-size:11px; color:var(--mute);
    background:var(--surface-3); border:1px solid var(--border); border-radius:6px; padding:2px 7px; margin-top:8px;
  }

  .metric-table, .cbt-table{ width:100%; border-collapse:collapse; font-size:13px; }
  .metric-table td{ padding:9px 6px; border-bottom:1px solid var(--border); }
  .metric-source{ margin-top:4px; font-size:11.5px; color:var(--mute-2); font-weight:400; }
  .metric-table td:first-child{ color:var(--mute-2); font-family:var(--font-mono); font-size:12px; width:150px; }
  .cbt-table th{
    text-align:left; padding:8px 6px; font-size:11.5px; color:var(--mute-2);
    font-family:var(--font-mono); border-bottom:2px solid var(--border-strong); font-weight:600;
  }
  .cbt-table td{ padding:9px 6px; border-bottom:1px solid var(--border); vertical-align:top; }
  .cbt-sub{ font-size:12.5px; font-weight:700; color:var(--mute); margin:14px 0 6px; }
  .cbt-sub:first-child{ margin-top:0; }
  .metric-note{ margin-top:8px; font-size:12px; color:var(--amber); }

  .sources{ display:flex; flex-direction:column; gap:5px; }
  .sources a{ color:var(--mute); font-size:12px; text-decoration:none; border-bottom:1px dotted var(--mute-2); }
  .sources a:hover{ color:var(--accent); border-color:var(--accent); }
  .video-link-groups{ margin-top:14px; display:grid; gap:10px; }
  .video-link-group{ padding-top:10px; border-top:1px solid var(--border); }
  .video-link-title{ margin-bottom:6px; font-size:12px; font-weight:700; color:var(--mute); }
  .video-link-list{ display:flex; flex-wrap:wrap; gap:6px; }
  .video-link{ display:inline-flex; align-items:center; max-width:100%; padding:7px 9px; border:1px solid var(--border-strong); border-radius:6px; color:var(--text); background:var(--panel); font-size:12px; text-decoration:none; }
  .video-link:hover{ border-color:var(--accent); color:var(--accent); }

  .disclaimer{ margin-top:18px; padding-top:14px; border-top:1px dashed var(--border-strong); font-size:11.5px; color:var(--mute-2); }
  .empty-state{ text-align:center; padding:40px 10px; color:var(--mute-2); font-size:13px; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:8px; }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <span class="live-dot"></span>
      <div>
        <h1>게임 동향 시그널 데스크</h1>
        <p class="subtitle">팀 공용 리서치 자동화 도구 · 생성된 보고서는 팀 전체와 공유됩니다</p>
      </div>
    </div>
    <span class="badge-live">ON&nbsp;AIR</span>
  </div>

  <div class="layout">

    <aside class="archive">
      <div class="archive-head">
        <span>ARCHIVE</span>
        <button id="newReportBtn" class="ghost-btn">+ 새 보고서</button>
      </div>
      <div id="archiveList" class="archive-list">
        <p class="empty-note">불러오는 중…</p>
      </div>
    </aside>

    <main class="main">

      <section id="formCard" class="card form-card">
        <h2>보고서 생성</h2>
        <p class="form-hint">💡 동명(同名) 게임 혼동을 막기 위해 개발사를 함께 입력하는 것을 권장합니다. 게임의 대표 특징 키워드(예: 몬스터 합체)를 함께 적으면 정확도가 더 올라갑니다.</p>

        <div class="field-row">
          <label>게임명
            <input id="gameNameInput" type="text" placeholder="예) Aniimo" />
          </label>
        </div>
        <div class="field-row two-col">
          <label>개발사 <span class="optional">(권장)</span>
            <input id="devInput" type="text" placeholder="예) Ember Entertainment" />
          </label>
          <label>해외 국가 <span class="optional">(선택)</span>
            <input id="countryInput" type="text" placeholder="예) 일본, 미국" />
          </label>
        </div>
        <div class="field-row">
          <label>게임 특징 힌트 <span class="optional">(선택 · 동명/오인 방지용)</span>
            <input id="hintInput" type="text" placeholder="예) 포켓몬풍 몬스터 수집, 몬스터와 캐릭터가 합체하는 트와인 시스템" />
          </label>
        </div>

        <div class="stage-row">
          <div class="stage-title">출시 상태</div>
          <div class="radio-group">
            <label class="radio-pill selected" id="pillReleased">
              <input type="radio" name="stage" value="released" checked /> 출시
            </label>
            <label class="radio-pill" id="pillCbt">
              <input type="radio" name="stage" value="cbt" /> 출시 전 (CBT/테스트)
            </label>
          </div>
          <div id="cbtNameWrap" class="hidden">
            <label class="text-label">이번 테스트 명칭
              <input id="cbtNameInput" type="text" placeholder="예) 한국 1차 CBT" />
            </label>
          </div>
        </div>

        <button id="generateBtn" class="primary-btn">시그널 수집 시작</button>
        <p id="statusText" class="status-text"></p>
        <div id="progressWrap" class="progress-wrap hidden">
          <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
          <div class="progress-label"><span id="progressPhase">대기 중</span><span id="progressPct">0%</span></div>
        </div>
      </section>

      <section id="reportCard" class="card report-card">
        <div class="empty-state">게임명을 입력하고 [시그널 수집 시작]을 누르면<br/>여기에 보고서가 표시됩니다.</div>
      </section>

    </main>
  </div>
</div>

<script>
(function(){

  const gameNameInput = document.getElementById('gameNameInput');
  const devInput = document.getElementById('devInput');
  const countryInput = document.getElementById('countryInput');
  const hintInput = document.getElementById('hintInput');
  const cbtNameInput = document.getElementById('cbtNameInput');
  const cbtNameWrap = document.getElementById('cbtNameWrap');
  const pillReleased = document.getElementById('pillReleased');
  const pillCbt = document.getElementById('pillCbt');
  const generateBtn = document.getElementById('generateBtn');
  const statusText = document.getElementById('statusText');
  const reportCard = document.getElementById('reportCard');
  const formCard = document.getElementById('formCard');
  const archiveList = document.getElementById('archiveList');
  const newReportBtn = document.getElementById('newReportBtn');
  const progressWrap = document.getElementById('progressWrap');
  const progressFill = document.getElementById('progressFill');
  const progressPhase = document.getElementById('progressPhase');
  const progressPct = document.getElementById('progressPct');

  let currentActiveId = null;
  let currentReport = null;
  let isEditing = false;
  let progressTimer = null;

  // ---------- stage radio ----------
  function getStage(){
    return document.querySelector('input[name="stage"]:checked').value;
  }
  function updateStageUI(){
    const stage = getStage();
    pillReleased.classList.toggle('selected', stage === 'released');
    pillCbt.classList.toggle('selected', stage === 'cbt');
    cbtNameWrap.classList.toggle('hidden', stage !== 'cbt');
  }
  pillReleased.querySelector('input').addEventListener('change', updateStageUI);
  pillCbt.querySelector('input').addEventListener('change', updateStageUI);

  // ---------- helpers ----------
  function slugify(str){
    return (str || 'game').trim().replace(/[\s\/\\'"]+/g,'_').slice(0,40);
  }
  function todayStr(){
    const d = new Date();
    const p = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())}`;
  }
  function escapeHtml(s){
    if (s === undefined || s === null) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function metricLabelKorean(label){
    const raw = String(label || '').trim();
    if (/steam.*(sales|revenue|gross|매출)/i.test(raw)) return 'Steam 매출 순위';
    if (/steam.*(concurrent|player|24.?hour|peak|동시|접속)/i.test(raw)) return 'Steam 24시간 최고 동시 접속자 수';
    if (/(sales|download|pre.?registration|preorder|판매|다운로드|사전.?예약)/i.test(raw)) return '판매량·다운로드·사전 예약자 수';
    if (/(app.?market|mobile.*rank|store.*rank|앱.?마켓|마켓.?순위)/i.test(raw)) return '앱 마켓 순위';
    return raw || '정량 지표';
  }
  function isUnavailableMetric(value){
    const v = String(value || '').trim().toLowerCase();
    return !v || /^(not available|n\/?a|unknown|not disclosed|not found|unavailable|확인 필요|추가 확인 필요|알 수 없음|미확인|데이터 없음|공개되지 않음)/i.test(v);
  }
  function metricDisplayData(metrics){
    const legacyItems = [
      { label: 'Steam 지표', value: metrics.steamdb, source: metrics.date ? `확인일 ${metrics.date}` : '' },
      { label: '판매량·다운로드·사전 예약자 수', value: metrics.sales, source: metrics.date ? `확인일 ${metrics.date}` : '' },
      { label: '앱 마켓 순위', value: metrics.rank, source: metrics.date ? `확인일 ${metrics.date}` : '' }
    ];
    const rawItems = Array.isArray(metrics.items) ? metrics.items : legacyItems;
    const removed = [];
    const items = rawItems.reduce((list, item) => {
      const label = metricLabelKorean(item?.label);
      if (isUnavailableMetric(item?.value)) {
        removed.push({ label, reason: item?.reason || '' });
        return list;
      }
      list.push({ label, value: String(item.value).trim(), source: String(item.source || '').trim() });
      return list;
    }, []);
    (Array.isArray(metrics.unavailable_items) ? metrics.unavailable_items : []).forEach(item => {
      const label = metricLabelKorean(item?.label);
      if (label && !items.some(entry => entry.label === label) && !removed.some(entry => entry.label === label)) {
        removed.push({ label, reason: String(item?.reason || '').trim() });
      }
    });
    const removedLabels = [...new Set(removed.map(item => item.label).filter(Boolean))];
    const reasons = [...new Set(removed.map(item => item.reason).filter(Boolean))];
    const removalNote = removedLabels.length
      ? `${reasons[0] || '확인 가능한 공개 수치가 없어'} ${removedLabels.join(', ')} 항목은 제외함.`
      : '';
    return { items, note: [metrics.note, removalNote].filter(Boolean).join(' ') };
  }
  function safeYouTubeUrl(url){
    try{
      const parsed = new URL(String(url || '').trim());
      const host = parsed.hostname.toLowerCase();
      return parsed.protocol === 'https:' && (host === 'youtube.com' || host.endsWith('.youtube.com') || host === 'youtu.be')
        ? parsed.href
        : '';
    }catch(e){ return ''; }
  }
  function videoLinksHtml(items){
    return (Array.isArray(items) ? items : []).map(item => {
      const url = safeYouTubeUrl(item?.url);
      if (!url) return '';
      const title = String(item?.title || 'YouTube 영상').trim();
      const channel = String(item?.channel || '').trim();
      return `<a class="video-link" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">▶ ${escapeHtml(title)}${channel ? ` · ${escapeHtml(channel)}` : ''}</a>`;
    }).filter(Boolean).join('');
  }
  function setProgress(pct, phaseLabel){
    progressFill.style.width = Math.max(0, Math.min(100, pct)) + '%';
    progressPct.textContent = Math.round(Math.max(0, Math.min(100, pct))) + '%';
    if (phaseLabel) progressPhase.textContent = phaseLabel;
  }

  let simulatedPct = 0;
  let progressCeiling = 30;
  function startProgressSim(){
    simulatedPct = 4;
    progressCeiling = 30;
    setProgress(simulatedPct, '조사 준비 중');
    progressTimer = setInterval(() => {
      if (simulatedPct < progressCeiling){
        simulatedPct += Math.max(0.15, (progressCeiling - simulatedPct) * 0.02);
        setProgress(simulatedPct);
      }
    }, 400);
  }
  function bumpProgress(ceiling, label){
    progressCeiling = ceiling;
    if (label) progressPhase.textContent = label;
  }
  function stopProgressSim(finalLabel){
    if (progressTimer){ clearInterval(progressTimer); progressTimer = null; }
    setProgress(100, finalLabel || '완료');
  }
  function failProgressSim(){
    if (progressTimer){ clearInterval(progressTimer); progressTimer = null; }
  }

  // ---------- sentiment ordering (긍정 → 부정 → 복합) ----------
  const SENT_ORDER = { positive: 0, negative: 1, mixed: 2 };
  const SENT_MARK = { positive: '▲', negative: '▼', mixed: '◆' };
  function sortDetail(detail){
    return [...(detail || [])].sort((a, b) =>

    );
  }

  }

    try{ await window.storage.set('reports-index', JSON.stringify(list), true); }

  }

        handle.setAttribute('contenteditable', 'false');
        item.prepend(handle);

        handle.addEventListener('mousedown', () => item.setAttribute('draggable', 'true'));
      }

      item.addEventListener('dragstart', (e) => {
        draggedItem = item;
        item.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        item.removeAttribute('draggable');
        draggedItem = null;
      });
      item.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (!draggedItem || draggedItem === item) return;
        const rect = item.getBoundingClientRect();
        const isAfter = e.clientY > rect.top + rect.height / 2;
        if (isAfter){
          item.after(draggedItem);
        } else {
          item.before(draggedItem);
        }
      });
    });
  }

${schema}

[REQUIRED REPORT RULES]
- This is a launch-trend report, not a generic game summary. overview.game_summary describes the game and its current launch/test context in 2-3 sentences. overview.positive_summary and overview.negative_summary separately summarize actual player sentiment. overview.service_mood ends with a concise assessment of the overall launch/service situation, including confidence and the main watchpoint.
- metrics.items must use Korean labels only and must be in this order when data is applicable: "Steam 매출 순위", "Steam 24시간 최고 동시 접속자 수", "판매량·다운로드·사전 예약자 수", "앱 마켓 순위". For Steam player data, use SteamDB's "24-hour peak" only; never use the current player count. Each value must be a very short number-focused statement only (for example: "1위", "10만 명", "사전 예약자 1,600만 명"). Put the source name, page, and date or URL in source, which is shown on the second line. Do not put English labels or explanations in value and do not invent numbers.
- Never write "Not available", "N/A", "확인 필요", or similar placeholders in metrics.items. If an applicable metric cannot be verified, omit it from items and add it to metrics.unavailable_items using its Korean label and a concise Korean reason, for example {"label":"Steam 매출 순위","reason":"출시 전이라 Steam 차트 데이터가 없어"}. The report will show a bottom note explaining that those items were excluded.
- For video_trend.official_pv, provide 1-2 verified HTTPS YouTube links from the official publisher/developer/game channel only. For video_trend.review_videos, provide 2-3 verified HTTPS YouTube links to independent review, analysis, or first-impression videos; do not use reuploads, shorts, search pages, channel pages, or fabricated URLs. Use an empty array when a verified link is unavailable.
- features must contain in-game playable systems only: combat, characters, progression, exploration, collection, multiplayer, controls, or other gameplay mechanics. Never include CBT schedules, login/invitation issues, beta data wipes, rewards, compensation, events, operations, monetization, or retention design in features.
- A favorable or unfavorable player reaction to service/reward/compensation/retention design belongs in sns_trend.detail with the correct sentiment. Factual test schedules and official operations belong in cbt_info, not features.
- All fields must be Korean except proper nouns and source titles.`;
  }

  function extractJson(text){
    let t = text.trim();
    t = t.replace(/```json/gi,'').replace(/```/g,'').trim();
    const start = t.indexOf('{');
    const end = t.lastIndexOf('}');
    if (start === -1 || end === -1) throw new Error('JSON 형식을 찾을 수 없습니다');
    return JSON.parse(t.slice(start, end+1));
  }

  // ---------- API call (pause_turn 대응) ----------
  async function callOpenAI(userMsg, isCbt){
    bumpProgress(25, 'OpenAI web search in progress');
    const response = await fetch('/api/report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        instructions: buildSystemPrompt(isCbt),
        input: userMsg
      })
    });
    const data = await response.json();
    if (!response.ok || data.error) throw new Error(data.error || 'OpenAI API request failed');
    if (!data.text || !data.text.trim()) throw new Error('OpenAI returned no text');
    return data.text;
  }

  // Legacy implementation retained below only as an inactive reference.
  async function callClaude(userMsg, isCbt){
    const messages = [{ role: 'user', content: userMsg }];
    const maxRounds = 6;
    let lastText = '';

    for (let round = 0; round < maxRounds; round++){
      bumpProgress(Math.min(20 + round * 15, 88), round === 0 ? '웹 검색 및 조사 중' : `조사 계속 진행 중 (${round + 1}라운드)`);

      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 8000,
          system: buildSystemPrompt(isCbt),
          messages: messages,
          tools: [{ type: 'web_search_20250305', name: 'web_search' }]
        })
      });

      const data = await response.json();
      if (data.error){
        throw new Error(data.error.message || 'API 오류가 발생했습니다');
      }

      const textInThisRound = (data.content || [])
        .filter(item => item.type === 'text')
        .map(item => item.text)
        .join('\n');
      if (textInThisRound.trim()) lastText = textInThisRound;

      if (data.stop_reason === 'pause_turn'){
        messages.push({ role: 'assistant', content: data.content });
        continue;
      }
      if (data.stop_reason === 'max_tokens'){
        messages.push({ role: 'assistant', content: data.content });
        messages.push({ role: 'user', content: '이어서 JSON을 끝까지 완성해줘. 지금까지 작성한 내용을 포함해 완전한 JSON 하나로 다시 출력해.' });
        continue;
      }
      return lastText;
    }
    return lastText;
  }

  async function generateReport(){
    const gameName = gameNameInput.value.trim();
    const dev = devInput.value.trim();
    const country = countryInput.value.trim();
    const hint = hintInput.value.trim();
    const stage = getStage();
    const cbtName = cbtNameInput.value.trim();
    const isCbt = stage === 'cbt';

    if (!gameName){
      statusText.textContent = '게임명을 입력해 주세요.';
      statusText.className = 'status-text err';
      return;
    }
    if (isCbt && !cbtName){
      statusText.textContent = '출시 전 게임은 이번 테스트 명칭을 입력해 주세요. (예: 한국 1차 CBT)';
      statusText.className = 'status-text err';
      return;
    }

    generateBtn.disabled = true;
    statusText.className = 'status-text';
    statusText.textContent = '';
    progressWrap.classList.remove('hidden');
    startProgressSim();

    let userMsg = `게임명: ${gameName}`;
    if (dev) userMsg += `\n개발사: ${dev}`;
    if (hint) userMsg += `\n게임 특징 힌트(이 특징과 일치하는 게임인지 검색으로 반드시 확인): ${hint}`;
    if (country) userMsg += `\n추가 조사 국가: ${country}`;
    if (isCbt){
      userMsg += `\n출시 상태: 출시 전 (테스트 진행 중)`;
      userMsg += `\n이번 테스트: ${cbtName} — 이 테스트에 대한 반응/정보만 수집할 것`;
    } else {
      userMsg += `\n출시 상태: 정식 출시`;
    }
    userMsg += `\n먼저 web_search로 이 게임을 충분히 조사한 뒤(최소 5회 검색), 지시된 JSON 스키마로 심층 보고서를 작성해줘.`;

    try{
      const fullText = await callOpenAI(userMsg, isCbt);
      if (!fullText.trim()) throw new Error('응답에서 텍스트를 찾을 수 없습니다');

      bumpProgress(95, '보고서 정리 중');
      const report = extractJson(fullText);
      report.generated_at = todayStr();
      report.stage_label = isCbt ? cbtName : '정식 출시';
      if (!report.info) report.info = {};
      if (dev && !report.info.dev) report.info.dev = dev;

      const id = Date.now() + '_' + slugify(gameName);
      currentActiveId = id;
      currentReport = report;

      await saveReport(id, report);
      const list = await loadArchive();
      list.unshift({
        id,
        game: report.game || gameName,
        dev: report.info.dev || dev || '',
        date: report.generated_at,
        overall: (report.sns_trend || {}).overall || '혼재',
        stage: report.stage_label
      });
      await saveArchive(list);
      renderArchiveList(list);

      isEditing = false;
      renderReport(report);
      stopProgressSim('완료');
      statusText.textContent = '✓ 보고서 생성 완료 — [내용 수정]으로 검수 후 PDF로 저장하세요';
      formCard.classList.add('hidden');

    }catch(err){
      console.error(err);
      failProgressSim();
      statusText.textContent = '보고서 생성에 실패했습니다: ' + err.message + ' (다시 시도해 주세요)';
      statusText.className = 'status-text err';
    }finally{
      generateBtn.disabled = false;
      setTimeout(() => { progressWrap.classList.add('hidden'); setProgress(0,'대기 중'); }, 1500);
    }
  }

  // ---------- standalone HTML export ----------
  function downloadShareHtml(report){
    if (isEditing){
      alert('먼저 [수정 완료]를 눌러 편집을 마친 뒤 공유용 HTML을 저장해 주세요.');
      return;
    }
    const clone = reportCard.cloneNode(true);
    clone.querySelector('.action-row')?.remove();
    clone.querySelector('.edit-banner')?.remove();
    clone.querySelector('#reportBody')?.removeAttribute('contenteditable');
    const styles = [...document.querySelectorAll('style')].map(style => style.textContent).join('\n');
    const page = `<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>${escapeHtml(report.game || 'game')}_동향보고서</title><style>${styles}\nbody{padding:20px;background:#F4F6F9}.report-card{max-width:1180px;margin:0 auto}.app,.main{max-width:none;padding:0;display:block}</style></head><body><main class="main">${clone.outerHTML}</main></body></html>`;
    const blob = new Blob([page], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${slugify(report.game)}_동향보고서_공유용.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---------- JSON export ----------
  function downloadJson(report){
    // 디자인 HTML 이식용: 구조화 데이터 전체 + 수정본 HTML 포함
    const exportData = { ...report };
    if (exportData.sns_trend && exportData.sns_trend.detail){
      exportData.sns_trend = { ...exportData.sns_trend, detail: sortDetail(exportData.sns_trend.detail) };
      // 사용자가 수정 모드에서 직접 순서를 바꾼 경우에는 그 순서(detail 배열 그대로)를 존중
      if (report.edited_html) exportData.sns_trend.detail = report.sns_trend.detail;
    }
    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${slugify(report.game)}_동향데이터.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---------- PDF export ----------
  async function downloadPdf(report){
    if (isEditing){
      alert('먼저 [수정 완료]를 눌러 편집을 마친 뒤 PDF로 저장해 주세요.');
      return;
    }
    const el = reportCard;
    const actionRow = el.querySelector('.action-row');
    if (actionRow) actionRow.style.visibility = 'hidden';

    try{
      // Split only at report section/card boundaries. The old exporter cropped one
      // tall image at arbitrary A4 heights, which split metric rows and cards.
      const exportCanvas = await html2canvas(el, { backgroundColor: '#FFFFFF', scale: 2 });
      const { jsPDF: PdfCtor } = window.jspdf;
      const exportPdf = new PdfCtor('p', 'pt', 'a4');
      const pageWidth = exportPdf.internal.pageSize.getWidth();
      const pageHeight = exportPdf.internal.pageSize.getHeight();
      const margin = 22;
      const contentWidth = pageWidth - margin * 2;
      const contentHeight = pageHeight - margin * 2;
      const pixelsPerPoint = exportCanvas.width / el.getBoundingClientRect().width;
      const maxSliceHeight = Math.floor(contentHeight * exportCanvas.width / contentWidth);
      const elTop = el.getBoundingClientRect().top;
      const breakPositions = selector => [...el.querySelectorAll(selector)]
        .map(node => Math.round((node.getBoundingClientRect().top - elTop) * pixelsPerPoint))
        .filter(y => y > 0 && y < exportCanvas.height)
        .sort((a, b) => a - b);
      const sectionBreaks = breakPositions('.section');
      const cardBreaks = breakPositions('.feature-item, .detail-item, .trend-box, .overview-box, .cbt-table');
      const bestBreak = (breaks, from, max) => breaks.filter(y => y > from + 20 && y <= max).pop();

      let sourceY = 0;
      let pageNumber = 0;
      while (sourceY < exportCanvas.height){
        const maxY = Math.min(sourceY + maxSliceHeight, exportCanvas.height);
        let cutY = bestBreak(sectionBreaks, sourceY, maxY);
        if (!cutY) cutY = bestBreak(cardBreaks, sourceY, maxY);
        if (!cutY || (cutY - sourceY) < maxSliceHeight * 0.38) cutY = maxY;
        const sliceHeight = cutY - sourceY;
        const slice = document.createElement('canvas');
        slice.width = exportCanvas.width;
        slice.height = sliceHeight;
        slice.getContext('2d').drawImage(exportCanvas, 0, sourceY, exportCanvas.width, sliceHeight, 0, 0, exportCanvas.width, sliceHeight);
        if (pageNumber > 0) exportPdf.addPage();
        exportPdf.addImage(slice.toDataURL('image/png'), 'PNG', margin, margin, contentWidth, sliceHeight * contentWidth / exportCanvas.width);
        sourceY = cutY;
        pageNumber += 1;
      }
      exportPdf.save(`${slugify(report.game)}_trend_report.pdf`);
      return;

      if (false){
      const canvas = await html2canvas(el, { backgroundColor: '#FFFFFF', scale: 2 });
      const imgData = canvas.toDataURL('image/png');
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p', 'pt', 'a4');
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      const imgWidth = pageWidth;
      const imgHeight = canvas.height * imgWidth / canvas.width;
      let heightLeft = imgHeight;
      let position = 0;

      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;

      while (heightLeft > 0){
        position = heightLeft - imgHeight;
        pdf.addPage();
        pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;
      }

      pdf.save(`${slugify(report.game)}_동향보고서.pdf`);
      }
    }catch(e){
      console.error(e);
      alert('PDF 생성에 실패했습니다: ' + e.message);
    }finally{
      if (actionRow) actionRow.style.visibility = 'visible';
    }
  }

  // ---------- init ----------
  updateStageUI();
  refreshArchiveList();

})();
</script>
