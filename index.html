<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게임 동향 시그널 데스크</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#F4F6F9;
    --surface:#FFFFFF;
    --surface-2:#F7F9FB;
    --surface-3:#EEF2F6;
    --border:#E1E7EE;
    --border-strong:#C9D3DE;
    --ink:#17232E;
    --mute:#5E6E7E;
    --mute-2:#93A1AF;
    --accent:#2456E6;
    --accent-soft:#EAF0FE;
    --pos:#0B9E63;
    --pos-soft:#E7F6EF;
    --neg:#D6455D;
    --neg-soft:#FBEDF0;
    --amber:#B7791F;
    --amber-soft:#FBF3E4;
    --font-display:-apple-system,'Apple SD Gothic Neo','Pretendard','Malgun Gothic',sans-serif;
    --font-body:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); line-height:1.55; }
  .app{ padding:20px; max-width:1180px; margin:0 auto; }

  /* ---------- topbar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; margin-bottom:18px;
    background:var(--surface);
    border:1px solid var(--border); border-radius:14px;
    box-shadow:0 1px 3px rgba(23,35,46,0.05);
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .live-dot{ width:10px; height:10px; border-radius:50%; background:var(--pos); animation:pulse 2s infinite; flex:none; }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(11,158,99,0.4); }
    70%{ box-shadow:0 0 0 8px rgba(11,158,99,0); }
    100%{ box-shadow:0 0 0 0 rgba(11,158,99,0); }
  }
  .brand h1{ font-family:var(--font-display); font-size:19px; font-weight:800; margin:0; letter-spacing:-0.01em; }
  .subtitle{ margin:2px 0 0; font-size:12.5px; color:var(--mute); }
  .badge-live{
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.08em; color:var(--pos);
    border:1px solid #BFE5D4; border-radius:20px; padding:5px 12px;
    background:var(--pos-soft); flex:none;
  }

  /* ---------- layout ---------- */
  .layout{ display:grid; grid-template-columns:270px 1fr; gap:18px; align-items:start; }
  @media (max-width:760px){ .layout{ grid-template-columns:1fr; } }

  .archive{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:16px; position:sticky; top:16px; box-shadow:0 1px 3px rgba(23,35,46,0.05);
  }
  .archive-head{
    display:flex; align-items:center; justify-content:space-between; font-size:12px; letter-spacing:0.08em;
    color:var(--mute-2); text-transform:uppercase; margin-bottom:10px; font-family:var(--font-mono);
  }
  .ghost-btn{
    background:none; border:1px solid var(--border-strong); color:var(--ink); border-radius:8px;
    padding:5px 9px; font-size:12px; cursor:pointer; font-family:var(--font-body);
    transition:border-color .15s, color .15s;
  }
  .ghost-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .archive-list{ display:flex; flex-direction:column; gap:8px; max-height:600px; overflow-y:auto; }
  .empty-note{ color:var(--mute-2); font-size:12.5px; margin:6px 2px; }
  .archive-notice{ margin:12px 2px 0; padding-top:10px; border-top:1px solid var(--border); color:var(--mute-2); font-size:11.5px; line-height:1.5; }
  .archive-item{
    display:flex; flex-direction:column; gap:3px; padding:10px 11px; background:var(--surface-2);
    border:1px solid var(--border); border-radius:10px; cursor:pointer; text-align:left; width:100%;
    transition:border-color .15s, background .15s;
  }
  .archive-item:hover{ border-color:var(--border-strong); background:var(--surface-3); }
  .archive-item.active{ border-color:var(--accent); background:var(--accent-soft); }
  .archive-item-top{ display:flex; align-items:center; gap:7px; }
  .sentiment-dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .sentiment-dot.긍정적, .sentiment-dot.positive{ background:var(--pos); }
  .sentiment-dot.부정적, .sentiment-dot.negative{ background:var(--neg); }
  .sentiment-dot.혼재, .sentiment-dot.mixed{ background:var(--amber); }
  .archive-item-name{ font-size:13px; font-weight:700; color:var(--ink); }
  .archive-item-dev{ font-size:11px; color:var(--mute); }
  .archive-item-date{ font-size:11px; color:var(--mute-2); font-family:var(--font-mono); }
  .archive-item-stage{
    display:inline-block; font-size:10px; font-family:var(--font-mono); padding:1px 6px;
    border-radius:4px; background:var(--amber-soft); color:var(--amber); width:fit-content;
  }

  /* ---------- main / cards ---------- */
  .main{ display:flex; flex-direction:column; gap:18px; }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:22px;
    box-shadow:0 1px 3px rgba(23,35,46,0.05);
  }
  .form-card h2{
    font-family:var(--font-display); font-size:14px; margin:0 0 6px; color:var(--mute);
    text-transform:uppercase; letter-spacing:0.06em;
  }
  .form-hint{ font-size:12px; color:var(--mute-2); margin:0 0 14px; }
  .field-row{ display:grid; grid-template-columns:1fr; gap:14px; margin-bottom:14px; }
  .field-row.two-col{ grid-template-columns:1fr 1fr; }
  @media (max-width:600px){ .field-row.two-col{ grid-template-columns:1fr; } }
  .field-row label, .stage-row label.text-label{ display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--mute); }
  .optional{ color:var(--mute-2); font-weight:400; }
  .field-row input, .stage-row input[type=text]{
    background:var(--surface); border:1px solid var(--border-strong); border-radius:9px; padding:10px 12px;
    color:var(--ink); font-size:14px; font-family:var(--font-body); outline:none; transition:border-color .15s, box-shadow .15s;
  }
  .field-row input:focus, .stage-row input[type=text]:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }

  .stage-row{ margin-bottom:14px; }
  .stage-title{ font-size:12.5px; color:var(--mute); margin-bottom:8px; }
  .radio-group{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .radio-pill{
    display:flex; align-items:center; gap:7px; padding:9px 14px; border:1px solid var(--border-strong);
    border-radius:9px; cursor:pointer; font-size:13.5px; background:var(--surface); transition:all .15s;
  }
  .radio-pill:hover{ border-color:var(--accent); }
  .radio-pill.selected{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:700; }
  .radio-pill input{ accent-color:var(--accent); margin:0; }
  #cbtNameWrap{ max-width:420px; }
  #cbtNameWrap input{ width:100%; }
  #updateScopeWrap{ max-width:640px; margin-top:4px; }

  .primary-btn{
    background:var(--accent); color:#fff; border:none; border-radius:9px; padding:11px 20px;
    font-size:14px; font-weight:700; cursor:pointer; font-family:var(--font-display);
    letter-spacing:-0.01em; transition:filter .15s, transform .1s;
  }
  .primary-btn:hover{ filter:brightness(1.08); }
  .primary-btn:active{ transform:scale(0.98); }
  .primary-btn:disabled{ opacity:0.55; cursor:default; }

  .status-text{ margin:12px 0 0; font-size:12.5px; color:var(--mute); font-family:var(--font-mono); min-height:16px; }
  .status-text.err{ color:var(--neg); }

  .progress-wrap{ margin-top:14px; }
  .progress-track{ height:8px; border-radius:6px; background:var(--surface-3); overflow:hidden; }
  .progress-fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--accent), var(--pos)); transition:width .3s ease; }
  .progress-label{ display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11.5px; color:var(--mute); margin-top:6px; }
  .progress-label #progressPct{ color:var(--accent); font-weight:700; }

  .hidden{ display:none !important; }

  /* ---------- report ---------- */
  .report-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .report-title{ font-family:var(--font-display); font-size:22px; font-weight:800; margin:0; }
  .report-title small{ display:block; font-size:12.5px; color:var(--mute); font-weight:500; margin-top:3px; }
  .report-meta{ font-size:12px; color:var(--mute-2); font-family:var(--font-mono); margin-top:6px; }
  .action-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .action-btn{
    background:var(--surface); border:1px solid var(--border-strong); color:var(--ink); border-radius:8px;
    padding:8px 13px; font-size:12.5px; cursor:pointer; font-family:var(--font-body); transition:all .15s;
  }
  .action-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .action-btn.saving{ background:var(--pos); border-color:var(--pos); color:#fff; }
  .edit-banner{
    background:var(--amber-soft); border:1px solid #E8D5AC; color:var(--amber);
    border-radius:9px; padding:9px 13px; font-size:12.5px; margin-bottom:14px;
  }

  #reportBody[contenteditable="true"]{ outline:2px dashed var(--amber); outline-offset:8px; border-radius:6px; }

  .section{ margin-bottom:24px; }
  .section:last-child{ margin-bottom:0; }
  .section-label{
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.1em; color:var(--accent);
    text-transform:uppercase; margin:0 0 10px; display:flex; align-items:center; gap:8px;
  }
  .section-label::before{ content:''; width:16px; height:1px; background:var(--accent); }

  .info-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  @media (max-width:600px){ .info-grid{ grid-template-columns:1fr 1fr; } }
  .info-cell{ background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:11px 13px; }
  .info-cell .k{ font-size:11px; color:var(--mute-2); font-family:var(--font-mono); }
  .info-cell .v{ font-size:13.5px; margin-top:3px; font-weight:700; }

  .overview-box{ background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:14px 16px; font-size:13.5px; }

  .feature-list{ display:flex; flex-direction:column; gap:10px; }
  .feature-item{ background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:13px 15px; }
  .feature-item-head{ display:flex; gap:10px; align-items:baseline; margin-bottom:7px; }
  .feature-num{ font-family:var(--font-mono); color:var(--accent); font-size:12px; flex:none; font-weight:700; }
  .feature-item-head b{ font-size:14px; }
  .feature-item ul{ margin:0; padding-left:18px; font-size:13px; color:var(--mute); }
  .feature-item li{ margin-bottom:5px; }
  .feature-item li:last-child{ margin-bottom:0; }

  .quick-tags{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px; }
  .quick-tag{ font-size:12px; padding:5px 10px; border-radius:20px; }
  .quick-tag.pos{ background:var(--pos-soft); color:var(--pos); border:1px solid #BFE5D4; }
  .quick-tag.neg{ background:var(--neg-soft); color:var(--neg); border:1px solid #F0C8D0; }

  .overall-tag{
    display:inline-block; font-size:12px; font-weight:700; padding:3px 10px; border-radius:20px;
    margin-bottom:12px; font-family:var(--font-mono);
  }
  .overall-tag.긍정적, .overall-tag.positive{ background:var(--pos-soft); color:var(--pos); border:1px solid #BFE5D4; }
  .overall-tag.부정적, .overall-tag.negative{ background:var(--neg-soft); color:var(--neg); border:1px solid #F0C8D0; }
  .overall-tag.혼재, .overall-tag.mixed{ background:var(--amber-soft); color:var(--amber); border:1px solid #E8D5AC; }
  .sentiment-assessment{ margin:0 0 13px; padding:12px 14px; border:1px solid var(--border); border-left:4px solid var(--amber); border-radius:10px; background:var(--surface-2); }
  .sentiment-assessment.positive{ border-left-color:var(--pos); }
  .sentiment-assessment.negative{ border-left-color:var(--neg); }
  .sentiment-assessment.mixed{ border-left-color:var(--amber); }
  .sentiment-assessment-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .sentiment-assessment-head b{ font-size:13.5px; }
  .sentiment-assessment p{ margin:7px 0 0; color:var(--mute); font-size:12.5px; }
  .sentiment-evidence{ margin-top:9px; display:grid; gap:5px; }
  .sentiment-evidence-item{ color:var(--mute); font-size:11.5px; line-height:1.55; }
  .sentiment-evidence-item b{ color:var(--ink); }
  .steam-top-reviews{ margin:15px 0 13px; padding:13px 14px; border:1px solid var(--border); border-radius:10px; background:var(--surface-2); }
  .steam-top-reviews-title{ margin:0 0 9px; font-size:12px; font-weight:700; color:var(--ink); }
  .steam-top-review-list{ display:grid; gap:8px; }
  .steam-top-review{ padding-left:10px; border-left:3px solid var(--amber); }
  .steam-top-review.positive{ border-left-color:var(--pos); }
  .steam-top-review.negative{ border-left-color:var(--neg); }
  .steam-top-review b{ display:block; font-size:12.5px; line-height:1.55; }
  .steam-top-review small{ display:block; margin-top:2px; color:var(--mute-2); font-family:var(--font-mono); font-size:10.5px; }
  .steam-top-review-note{ margin:8px 0 0; color:var(--mute); font-size:11.5px; line-height:1.55; }
  .launch-signal{ margin-bottom:24px; padding:14px 16px; border:1px solid var(--border-strong); border-left:4px solid var(--accent); border-radius:10px; background:var(--accent-soft); }
  .launch-signal-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .launch-signal-head b{ font-size:13.5px; }
  .launch-signal p{ margin:7px 0 0; color:var(--mute); font-size:12.5px; }
  .launch-signal-meta{ display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
  .launch-signal-meta span{ padding:3px 7px; border-radius:5px; background:var(--surface); border:1px solid var(--border); color:var(--mute); font-family:var(--font-mono); font-size:11px; }

  .detail-list{ display:flex; flex-direction:column; gap:9px; }
  .detail-item{
    display:flex; gap:10px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:10px; padding:12px 14px; position:relative; transition:box-shadow .15s;
  }
  .detail-item.positive{ border-left:3px solid var(--pos); }
  .detail-item.negative{ border-left:3px solid var(--neg); }
  .detail-item.mixed{ border-left:3px solid var(--amber); }
  .detail-item.dragging{ opacity:0.45; box-shadow:0 4px 14px rgba(23,35,46,0.18); }
  .detail-marker{ flex:none; font-size:13px; padding-top:1px; font-weight:700; }
  .detail-marker.positive{ color:var(--pos); }
  .detail-marker.negative{ color:var(--neg); }
  .detail-marker.mixed{ color:var(--amber); }
  .detail-body b{ display:block; font-size:13.5px; margin-bottom:3px; }
  .detail-body span{ font-size:13px; color:var(--mute); }
  .drag-handle{
    flex:none; cursor:grab; color:var(--mute-2); font-size:15px; padding:0 3px;
    user-select:none; align-self:center;
  }
  .drag-handle:active{ cursor:grabbing; }

  .trend-box{ background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:13px 14px; font-size:13.5px; }
  .trend-box ul{ margin:8px 0 0; padding-left:18px; color:var(--mute); font-size:13px; }
  .date-chip{
    display:inline-block; font-family:var(--font-mono); font-size:11px; color:var(--mute);
    background:var(--surface-3); border:1px solid var(--border); border-radius:6px; padding:2px 7px; margin-top:8px;
  }

  .metric-table, .cbt-table{ width:100%; border-collapse:collapse; font-size:13px; }
  .metric-table td{ padding:9px 6px; border-bottom:1px solid var(--border); }
  .metric-source{ margin-top:4px; font-size:11.5px; color:var(--mute-2); font-weight:400; }
  .metric-table td:first-child{ color:var(--mute-2); font-family:var(--font-mono); font-size:12px; width:150px; }
  .cbt-table th{
    text-align:left; padding:8px 6px; font-size:11.5px; color:var(--mute-2);
    font-family:var(--font-mono); border-bottom:2px solid var(--border-strong); font-weight:600;
  }
  .cbt-table td{ padding:9px 6px; border-bottom:1px solid var(--border); vertical-align:top; }
  .cbt-sub{ font-size:12.5px; font-weight:700; color:var(--mute); margin:14px 0 6px; }
  .cbt-sub:first-child{ margin-top:0; }
  .metric-note{ margin-top:8px; font-size:12px; color:var(--amber); }

  .sources{ display:flex; flex-direction:column; gap:5px; }
  .sources a{ color:var(--mute); font-size:12px; text-decoration:none; border-bottom:1px dotted var(--mute-2); }
  .sources a:hover{ color:var(--accent); border-color:var(--accent); }
  .video-link-groups{ margin-top:14px; display:grid; gap:10px; }
  .video-link-group{ padding-top:10px; border-top:1px solid var(--border); }
  .video-link-title{ margin-bottom:6px; font-size:12px; font-weight:700; color:var(--mute); }
  .video-link-list{ display:flex; flex-wrap:wrap; gap:6px; }
  .video-link{ display:inline-flex; align-items:center; max-width:100%; padding:7px 9px; border:1px solid var(--border-strong); border-radius:6px; color:var(--text); background:var(--panel); font-size:12px; text-decoration:none; }
  .video-link:hover{ border-color:var(--accent); color:var(--accent); }

  .disclaimer{ margin-top:18px; padding-top:14px; border-top:1px dashed var(--border-strong); font-size:11.5px; color:var(--mute-2); }
  .empty-state{ text-align:center; padding:40px 10px; color:var(--mute-2); font-size:13px; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:8px; }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <span class="live-dot"></span>
      <div>
        <h1>게임 동향 시그널 데스크</h1>
        <p class="subtitle">팀 공용 리서치 자동화 도구 · 생성된 보고서는 팀 전체와 공유됩니다</p>
      </div>
    </div>
    <span class="badge-live">ON&nbsp;AIR</span>
  </div>

  <div class="layout">

    <aside class="archive">
      <div class="archive-head">
        <span>ARCHIVE</span>
        <button id="newReportBtn" class="ghost-btn">+ 새 보고서</button>
      </div>
      <div id="archiveList" class="archive-list">
        <p class="empty-note">불러오는 중…</p>
      </div>
      <p class="archive-notice">보고서는 해당 페이지에서만 유효합니다. 필요하신 데이터는 필히 저장해주세요.</p>
    </aside>

    <main class="main">

      <section id="formCard" class="card form-card">
        <h2>보고서 생성</h2>
        <p class="form-hint">💡 동명(同名) 게임 혼동을 막기 위해 개발사를 함께 입력하는 것을 권장합니다. 게임의 대표 특징 키워드(예: 몬스터 합체)를 함께 적으면 정확도가 더 올라갑니다.</p>

        <div class="field-row">
          <label>게임명
            <input id="gameNameInput" type="text" placeholder="예) Aniimo" />
          </label>
        </div>
        <div class="field-row two-col">
          <label>개발사 <span class="optional">(권장)</span>
            <input id="devInput" type="text" placeholder="예) Ember Entertainment" />
          </label>
          <label>검색할 지역 <span class="optional">(선택)</span>
            <input id="countryInput" type="text" placeholder="예) 일본, 미국" />
          </label>
        </div>
        <div class="field-row">
          <label>게임 특징 힌트 <span class="optional">(선택 · 동명/오인 방지용)</span>
            <input id="hintInput" type="text" placeholder="예) 포켓몬풍 몬스터 수집, 몬스터와 캐릭터가 합체하는 트와인 시스템" />
          </label>
        </div>
        <div class="field-row">
          <label>서치 포인트 <span class="optional">(선택 · 특히 확인하고 싶은 부분)</span>
            <input id="searchPointInput" type="text" placeholder="예) 과금에 대한 유저 반응, 경쟁작과의 차이, 출시 초반 흥행 가능성" />
          </label>
        </div>

        <div class="stage-row">
          <div class="stage-title">출시 상태</div>
          <div class="radio-group">
            <label class="radio-pill selected" id="pillReleased">
              <input type="radio" name="stage" value="released" checked /> 출시
            </label>
            <label class="radio-pill" id="pillCbt">
              <input type="radio" name="stage" value="cbt" /> 출시 전 (CBT/테스트)
            </label>
            <label class="radio-pill" id="pillUpdate">
              <input type="radio" name="stage" value="update" /> 특정 업데이트/캐릭터 출시 동향
            </label>
          </div>
          <div id="cbtNameWrap" class="hidden">
            <label class="text-label">이번 테스트 명칭
              <input id="cbtNameInput" type="text" placeholder="예) 한국 1차 CBT" />
            </label>
          </div>
          <div id="updateScopeWrap" class="hidden">
            <div class="field-row two-col">
              <label>업데이트 날짜
                <input id="updateDateInput" type="date" />
              </label>
              <label>업데이트 내용 / 캐릭터명
                <input id="updateTargetInput" type="text" placeholder="예) 姬子 啟行 출시, 2.3 신규 지역 업데이트" />
              </label>
            </div>
          </div>
        </div>

        <button id="generateBtn" class="primary-btn">시그널 수집 시작</button>
        <p id="statusText" class="status-text"></p>
        <div id="progressWrap" class="progress-wrap hidden">
          <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
          <div class="progress-label"><span id="progressPhase">대기 중</span><span id="progressPct">0%</span></div>
        </div>
      </section>

      <section id="reportCard" class="card report-card">
        <div class="empty-state">게임명을 입력하고 [시그널 수집 시작]을 누르면<br/>여기에 보고서가 표시됩니다.</div>
      </section>

    </main>
  </div>
</div>

<script>
(function(){

  const gameNameInput = document.getElementById('gameNameInput');
  const devInput = document.getElementById('devInput');
  const countryInput = document.getElementById('countryInput');
  const hintInput = document.getElementById('hintInput');
  const searchPointInput = document.getElementById('searchPointInput');
  const cbtNameInput = document.getElementById('cbtNameInput');
  const cbtNameWrap = document.getElementById('cbtNameWrap');
  const updateDateInput = document.getElementById('updateDateInput');
  const updateTargetInput = document.getElementById('updateTargetInput');
  const updateScopeWrap = document.getElementById('updateScopeWrap');
  const pillReleased = document.getElementById('pillReleased');
  const pillCbt = document.getElementById('pillCbt');
  const pillUpdate = document.getElementById('pillUpdate');
  const generateBtn = document.getElementById('generateBtn');
  const statusText = document.getElementById('statusText');
  const reportCard = document.getElementById('reportCard');
  const formCard = document.getElementById('formCard');
  const archiveList = document.getElementById('archiveList');
  const newReportBtn = document.getElementById('newReportBtn');
  const progressWrap = document.getElementById('progressWrap');
  const progressFill = document.getElementById('progressFill');
  const progressPhase = document.getElementById('progressPhase');
  const progressPct = document.getElementById('progressPct');

  let currentActiveId = null;
  let currentReport = null;
  let isEditing = false;
  let progressTimer = null;

  // ---------- stage radio ----------
  function getStage(){
    return document.querySelector('input[name="stage"]:checked').value;
  }
  function updateStageUI(){
    const stage = getStage();
    pillReleased.classList.toggle('selected', stage === 'released');
    pillCbt.classList.toggle('selected', stage === 'cbt');
    pillUpdate.classList.toggle('selected', stage === 'update');
    cbtNameWrap.classList.toggle('hidden', stage !== 'cbt');
    updateScopeWrap.classList.toggle('hidden', stage !== 'update');
  }
  pillReleased.querySelector('input').addEventListener('change', updateStageUI);
  pillCbt.querySelector('input').addEventListener('change', updateStageUI);
  pillUpdate.querySelector('input').addEventListener('change', updateStageUI);

  // ---------- helpers ----------
  function slugify(str){
    return (str || 'game').trim().replace(/[\s\/\\'"]+/g,'_').slice(0,40);
  }
  function todayStr(){
    const d = new Date();
    const p = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())}`;
  }
  function escapeHtml(s){
    if (s === undefined || s === null) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function metricLabelKorean(label){
    const raw = String(label || '').trim();
    if (/steam.*(sales|revenue|gross|매출)/i.test(raw)) return 'Steam 매출 순위';
    if (/steam.*(concurrent|player|24.?hour|peak|동시|접속)/i.test(raw)) return 'Steam 24시간 최고 동시 접속자 수';
    if (/(sales|download|pre.?registration|preorder|판매|다운로드|사전.?예약)/i.test(raw)) return '판매량·다운로드·사전 예약자 수';
    if (/(app.?market|mobile.*rank|store.*rank|앱.?마켓|마켓.?순위)/i.test(raw)) return '앱 마켓 순위';
    return raw || '정량 지표';
  }
  function isUnavailableMetric(value){
    const v = String(value || '').trim().toLowerCase();
    return !v || /^(not available|n\/?a|unknown|not disclosed|not found|unavailable|확인 필요|추가 확인 필요|알 수 없음|미확인|데이터 없음|공개되지 않음)/i.test(v);
  }
  const STEAM_GLOBAL_TOP_SELLERS_URL = 'https://store.steampowered.com/charts/topselling/global';
  function isOfficialSteamGlobalTopSellersSource(source){
    return /(?:https?:\/\/)?store\.steampowered\.com\/charts\/topselling\/global(?:[/?#]|$)/i.test(String(source || ''));
  }
  function metricScope(value){
    const scope = String(value || '').trim();
    return scope && !/^(unknown|n\/?a|미상|불명|확인 불가|없음)$/i.test(scope) ? scope : '';
  }
  function metricDisplayData(metrics){
    const legacyItems = [
      { label: 'Steam 지표', value: metrics.steamdb, source: metrics.date ? `확인일 ${metrics.date}` : '' },
      { label: '판매량·다운로드·사전 예약자 수', value: metrics.sales, source: metrics.date ? `확인일 ${metrics.date}` : '' },
      { label: '앱 마켓 순위', value: metrics.rank, source: metrics.date ? `확인일 ${metrics.date}` : '' }
    ];
    const rawItems = Array.isArray(metrics.items) ? metrics.items : legacyItems;
    const removed = [];
    const items = rawItems.reduce((list, item) => {
      const label = metricLabelKorean(item?.label);
      if (isUnavailableMetric(item?.value)) {
        removed.push({ label, reason: item?.reason || '' });
        return list;
      }
      const source = String(item?.source || '').trim();
      if (label === 'Steam 매출 순위' && !isOfficialSteamGlobalTopSellersSource(source)) {
        removed.push({ label, reason: 'Steam 공식 글로벌 Top Sellers 차트 출처를 확인할 수 없어' });
        return list;
      }
      const scope = metricScope(item?.scope);
      if (label === '앱 마켓 순위' && !scope) {
        removed.push({ label, reason: '앱 마켓 순위의 국가·지역 범위를 확인할 수 없어' });
        return list;
      }
      if (label === '앱 마켓 순위' && /^글로벌$/i.test(scope) && !/(global|worldwide|전 세계|전세계)/i.test(source)) {
        removed.push({ label, reason: '앱 마켓 순위의 글로벌 범위를 공식 출처에서 확인할 수 없어' });
        return list;
      }
      const displayLabel = label === '앱 마켓 순위' && !/^글로벌$/i.test(scope) ? `${label} (${scope})` : label;
      list.push({ label: displayLabel, value: String(item.value).trim(), source });
      return list;
    }, []);
    (Array.isArray(metrics.unavailable_items) ? metrics.unavailable_items : []).forEach(item => {
      const label = metricLabelKorean(item?.label);
      if (label && !items.some(entry => metricLabelKorean(entry.label) === label) && !removed.some(entry => entry.label === label)) {
        removed.push({ label, reason: String(item?.reason || '').trim() });
      }
    });
    const removedLabels = [...new Set(removed.map(item => item.label).filter(Boolean))];
    const reasons = [...new Set(removed.map(item => item.reason).filter(Boolean))];
    const removalNote = removedLabels.length
      ? `${reasons[0] || '확인 가능한 공개 수치가 없어'} ${removedLabels.join(', ')} 항목은 제외함.`
      : '';
    return { items, note: [metrics.note, removalNote].filter(Boolean).join(' ') };
  }
  function safeYouTubeUrl(url){
    try{
      const parsed = new URL(String(url || '').trim());
      const host = parsed.hostname.toLowerCase();
      return parsed.protocol === 'https:' && (host === 'youtube.com' || host.endsWith('.youtube.com') || host === 'youtu.be')
        ? parsed.href
        : '';
    }catch(e){ return ''; }
  }
  function videoLinksHtml(items){
    return (Array.isArray(items) ? items : []).map(item => {
      const url = safeYouTubeUrl(item?.url);
      if (!url) return '';
      const title = String(item?.title || 'YouTube 영상').trim();
      const channel = String(item?.channel || '').trim();
      return `<a class="video-link" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">▶ ${escapeHtml(title)}${channel ? ` · ${escapeHtml(channel)}` : ''}</a>`;
    }).filter(Boolean).join('');
  }
  function setProgress(pct, phaseLabel){
    progressFill.style.width = Math.max(0, Math.min(100, pct)) + '%';
    progressPct.textContent = Math.round(Math.max(0, Math.min(100, pct))) + '%';
    if (phaseLabel) progressPhase.textContent = phaseLabel;
  }

  let simulatedPct = 0;
  let progressCeiling = 30;
  function startProgressSim(){
    simulatedPct = 4;
    progressCeiling = 30;
    setProgress(simulatedPct, '조사 준비 중');
    progressTimer = setInterval(() => {
      if (simulatedPct < progressCeiling){
        simulatedPct += Math.max(0.15, (progressCeiling - simulatedPct) * 0.02);
        setProgress(simulatedPct);
      }
    }, 400);
  }
  function bumpProgress(ceiling, label){
    progressCeiling = ceiling;
    if (label) progressPhase.textContent = label;
  }
  function stopProgressSim(finalLabel){
    if (progressTimer){ clearInterval(progressTimer); progressTimer = null; }
    setProgress(100, finalLabel || '완료');
  }
  function failProgressSim(){
    if (progressTimer){ clearInterval(progressTimer); progressTimer = null; }
  }

  // ---------- sentiment ordering (긍정 → 부정 → 복합) ----------
  const SENT_ORDER = { positive: 0, negative: 1, mixed: 2 };
  const SENT_MARK = { positive: '▲', negative: '▼', mixed: '◆' };
  function sortDetail(detail){
    return [...(detail || [])].sort((a, b) =>
      (SENT_ORDER[a.sentiment] ?? 3) - (SENT_ORDER[b.sentiment] ?? 3)
    );
  }
  function sentimentClass(value){
    const v = String(value || '').toLowerCase();
    if (v.includes('positive') || v.includes('긍정')) return 'positive';
    if (v.includes('negative') || v.includes('부정')) return 'negative';
    return 'mixed';
  }
  function sentimentLabel(value){
    const kind = sentimentClass(value);
    return kind === 'positive' ? '긍정 우세' : kind === 'negative' ? '부정 우세' : '혼재';
  }
  function opinionCountLabel(value){
    const n = Number(value);
    return Number.isInteger(n) && n >= 0 ? `${n}건` : '확인 불가';
  }
  function opinionSampleTotal(counts){
    const values = ['positive', 'negative', 'mixed'].map(key => Number(counts?.[key]));
    return values.every(n => Number.isInteger(n) && n >= 0) ? values.reduce((sum, n) => sum + n, 0) : null;
  }
  function helpfulReviewCount(value){
    const count = Number(String(value ?? '').replace(/[^\d]/g, ''));
    return Number.isSafeInteger(count) && count >= 0 ? count : null;
  }
  function steamTopReviews(items){
    return (Array.isArray(items) ? items : [])
      .filter(item => {
        const kind = sentimentClass(item?.sentiment);
        return (kind === 'positive' || kind === 'negative') && Boolean(String(item?.summary || '').trim()) && helpfulReviewCount(item?.helpful_count) !== null;
      })
      .sort((a, b) => helpfulReviewCount(b.helpful_count) - helpfulReviewCount(a.helpful_count))
      .slice(0, 3);
  }

  // ---------- storage ----------
  async function loadArchive(){
    try{
      const res = await window.storage.get('reports-index', true);
      return res ? JSON.parse(res.value) : [];
    }catch(e){ return []; }
  }
  async function saveArchive(list){
    try{ await window.storage.set('reports-index', JSON.stringify(list), true); }
    catch(e){ console.error('archive save failed', e); }
  }
  async function saveReport(id, report){
    try{ await window.storage.set('report:'+id, JSON.stringify(report), true); }
    catch(e){ console.error('report save failed', e); }
  }
  async function getReport(id){
    try{
      const res = await window.storage.get('report:'+id, true);
      return res ? JSON.parse(res.value) : null;
    }catch(e){ return null; }
  }

  function renderArchiveList(list){
    if (!list.length){
      archiveList.innerHTML = '<p class="empty-note">아직 생성된 보고서가 없습니다.</p>';
      return;
    }
    archiveList.innerHTML = '';
    list.forEach(item => {
      const btn = document.createElement('button');
      btn.className = 'archive-item' + (item.id === currentActiveId ? ' active' : '');
      btn.innerHTML = `
        <div class="archive-item-top">
          <span class="sentiment-dot ${sentimentClass(item.overall)}"></span>
          <span class="archive-item-name">${escapeHtml(item.game)}</span>
        </div>
        ${item.stage ? `<span class="archive-item-stage">${escapeHtml(item.stage)}</span>` : ''}
        <span class="archive-item-dev">${escapeHtml(item.dev || '')}</span>
        <span class="archive-item-date">${escapeHtml(item.date)}</span>
      `;
      btn.addEventListener('click', () => openArchivedReport(item.id));
      archiveList.appendChild(btn);
    });
  }

  async function refreshArchiveList(){
    renderArchiveList(await loadArchive());
  }

  async function openArchivedReport(id){
    statusText.textContent = '';
    statusText.className = 'status-text';
    const report = await getReport(id);
    if (!report){
      statusText.textContent = '보고서를 불러오지 못했습니다.';
      statusText.className = 'status-text err';
      return;
    }
    currentActiveId = id;
    currentReport = report;
    isEditing = false;
    renderReport(report);
    formCard.classList.add('hidden');
    refreshArchiveList();
  }

  newReportBtn.addEventListener('click', () => {
    if (isEditing){
      alert('기존 보고서의 수정을 먼저 완료해 주세요.');
      return;
    }
    formCard.classList.remove('hidden');
    gameNameInput.focus();
  });

  // ---------- render report ----------
  function buildReportBodyHtmlV2(report){
    const info = report.info || {};
    const sns = report.sns_trend || {};
    const video = report.video_trend || {};
    const cbt = report.cbt_info;
    const sources = report.sources || [];
    const features = (report.features || []).filter(f => f.category !== 'service_design' && f.category !== 'operations');
    const overview = typeof report.overview === 'object' && report.overview !== null
      ? report.overview
      : { game_summary: report.overview || '', positive_summary: (sns.quick_pos || []).join(' · '), negative_summary: (sns.quick_neg || []).join(' · '), service_mood: sns.overall ? `전반 분위기: ${sns.overall}` : '' };
    const metrics = report.metrics || {};
    const metricDisplay = metricDisplayData(metrics);
    const detail = sortDetail(sns.detail);
    const officialPvLinks = videoLinksHtml(video.official_pv);
    const reviewVideoLinks = videoLinksHtml(video.review_videos);
    const assessment = sns.assessment || {};
    const sampleCounts = assessment.sample_counts || {};
    const totalSampleCount = opinionSampleTotal(sampleCounts);
    const assessmentEvidence = Array.isArray(assessment.evidence) ? assessment.evidence.slice(0, 4) : [];
    const steamRating = assessment.steam_rating || {};
    const userTrend = assessment.user_trend || {};
    const topSteamReviews = steamTopReviews(sns.steam_top_reviews);
    const steamReviewNote = String(sns.steam_review_note || '').trim();
    const sentimentValue = assessment.verdict || sns.overall;
    const sentimentKind = sentimentClass(sentimentValue);
    const sentimentVerdict = sentimentLabel(sentimentValue);
    const isUpdateReport = report.report_mode === 'update';
    const updateTarget = report.update_target || report.stage_label || '특정 업데이트/캐릭터';
    const updateDate = report.update_date || '';
    const launchSignal = report.launch_signal || {};
    const hasLaunchSignal = !isUpdateReport && (launchSignal.summary || launchSignal.phase || launchSignal.community_posts || launchSignal.youtube_videos);

    return `
      ${isUpdateReport ? `
      <div class="section">
        <p class="section-label">조사 범위</p>
        <div class="info-grid">
          <div class="info-cell"><div class="k">대상</div><div class="v">${escapeHtml(updateTarget)}</div></div>
          <div class="info-cell"><div class="k">업데이트/출시일</div><div class="v">${escapeHtml(updateDate) || '추가 확인 필요'}</div></div>
          <div class="info-cell"><div class="k">조사 원칙</div><div class="v">해당 대상 관련 내용만 수집</div></div>
        </div>
      </div>` : `
      <div class="section">
        <p class="section-label">기본 정보</p>
        <div class="info-grid">
          <div class="info-cell"><div class="k">장르</div><div class="v">${escapeHtml(info.genre) || '추가 확인 필요'}</div></div>
          <div class="info-cell"><div class="k">개발사</div><div class="v">${escapeHtml(info.dev) || '추가 확인 필요'}</div></div>
          <div class="info-cell"><div class="k">유통사</div><div class="v">${escapeHtml(info.pub) || '추가 확인 필요'}</div></div>
          <div class="info-cell"><div class="k">플랫폼</div><div class="v">${escapeHtml(info.platform) || '추가 확인 필요'}</div></div>
          <div class="info-cell"><div class="k">엔진</div><div class="v">${escapeHtml(info.engine) || '추가 확인 필요'}</div></div>
          <div class="info-cell"><div class="k">출시/테스트 일정</div><div class="v">${escapeHtml(info.release) || '추가 확인 필요'}</div></div>
        </div>
        ${info.note ? `<div class="metric-note">${escapeHtml(info.note)}</div>` : ''}
      </div>`}

      ${hasLaunchSignal ? `
      <div class="launch-signal">
        <div class="launch-signal-head"><b>초기 출시 동향</b>${launchSignal.phase ? `<span class="date-chip">${escapeHtml(launchSignal.phase)}</span>` : ''}${launchSignal.attention ? `<span class="date-chip">주목도 ${escapeHtml(launchSignal.attention)}</span>` : ''}${launchSignal.data_sufficiency ? `<span class="date-chip">데이터 ${escapeHtml(launchSignal.data_sufficiency)}</span>` : ''}</div>
        <p>${escapeHtml(launchSignal.summary) || '초기 동향 데이터를 수집 중입니다.'}</p>
        <div class="launch-signal-meta">
          ${launchSignal.community_posts ? `<span>커뮤니티 게시글 ${escapeHtml(launchSignal.community_posts)}</span>` : ''}
          ${launchSignal.youtube_videos ? `<span>유튜브 관련 영상 ${escapeHtml(launchSignal.youtube_videos)}</span>` : ''}
          ${launchSignal.scope ? `<span>${escapeHtml(launchSignal.scope)}</span>` : ''}
        </div>
      </div>` : ''}

      <div class="section">
        <p class="section-label">${isUpdateReport ? '업데이트·캐릭터 출시 동향' : '게임 소개 및 출시 동향'}</p>
        <div class="overview-box">
          <p><b>${isUpdateReport ? '대상 소개 및 출시 상황' : '게임 소개'}</b><br>${escapeHtml(overview.game_summary) || '추가 확인 필요'}</p>
          <p><b>긍정 반응 요약</b><br>${escapeHtml(overview.positive_summary) || '추가 확인 필요'}</p>
          <p><b>부정·우려 반응 요약</b><br>${escapeHtml(overview.negative_summary) || '추가 확인 필요'}</p>
          <p><b>출시 동향 종합</b><br>${escapeHtml(overview.service_mood) || '추가 확인 필요'}</p>
        </div>
      </div>

      ${!isUpdateReport ? `<div class="section">
        <p class="section-label">정량 지표</p>
        ${metricDisplay.items.length ? `<table class="metric-table">
          ${metricDisplay.items.map(item => `<tr><td>${escapeHtml(item.label)}</td><td><b>${escapeHtml(item.value)}</b>${item.source ? `<div class="metric-source">출처: ${escapeHtml(item.source)}</div>` : ''}</td></tr>`).join('')}
        </table>` : ''}
        ${metricDisplay.note ? `<div class="metric-note">${escapeHtml(metricDisplay.note)}</div>` : ''}
      </div>` : ''}

      ${cbt && !isUpdateReport ? `
      <div class="section">
        <p class="section-label">CBT 정보</p>
        <div class="cbt-sub">역대 테스트 이력</div>
        <table class="cbt-table">
          <tr><th>테스트명</th><th>기간</th><th>지역/플랫폼</th><th>비고</th></tr>
          ${(cbt.history||[]).map(h=>`<tr><td><b>${escapeHtml(h.name)}</b></td><td>${escapeHtml(h.period)}</td><td>${escapeHtml(h.region)}</td><td>${escapeHtml(h.note)}</td></tr>`).join('')}
        </table>

  // ---------- drag & drop (수정 모드 전용) ----------
  let draggedItem = null;

  function enableDetailDrag(reportBody){
    const list = reportBody.querySelector('#detailList') || reportBody.querySelector('.detail-list');
    if (!list) return;

    list.querySelectorAll('.detail-item').forEach(item => {
      // 드래그 핸들 추가
      if (!item.querySelector('.drag-handle')){
        const handle = document.createElement('span');
        handle.className = 'drag-handle';
        handle.textContent = '⠿';
        handle.title = '드래그하여 순서 변경';
        handle.setAttribute('contenteditable', 'false');
        item.prepend(handle);

        handle.addEventListener('mousedown', () => item.setAttribute('draggable', 'true'));
      }

      item.addEventListener('dragstart', (e) => {
        draggedItem = item;
        item.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        item.removeAttribute('draggable');
        draggedItem = null;
      });
      item.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (!draggedItem || draggedItem === item) return;
        const rect = item.getBoundingClientRect();
        const isAfter = e.clientY > rect.top + rect.height / 2;
        if (isAfter){
          item.after(draggedItem);
        } else {
          item.before(draggedItem);
        }
      });
    });
  }

  function disableDetailDrag(reportBody){
    reportBody.querySelectorAll('.drag-handle').forEach(h => h.remove());
    reportBody.querySelectorAll('.detail-item').forEach(item => item.removeAttribute('draggable'));
  }

  function syncDetailFromDom(reportBody, report){
    const items = reportBody.querySelectorAll('.detail-item');
    if (!items.length || !report.sns_trend) return;
    const newDetail = [...items].map(el => ({
      label: (el.querySelector('.detail-body b')?.textContent || '').trim(),
      sentiment: el.dataset.sent || 'positive',
      desc: (el.querySelector('.detail-body span')?.textContent || '').trim()
    }));
    report.sns_trend.detail = newDetail;
  }

[깊이 있는 조사]
- 실제 게임을 플레이하지 않고도 이해할 수 있을 정도로 구체적으로 작성하세요.
- features는 3~4개 항목, 각 항목마다 points 2~4개. 수치·경쟁작 비교·실제 조작 방식 포함.
- sns_trend.detail은 4~6개 항목. label(압축 제목) + sentiment(positive/negative/mixed) + desc(2~3문장의 구체적 근거). 긍정/부정/복합을 골고루 포함하고, 복합적인 의견(장점과 단점이 함께 언급되는 반응)은 sentiment를 "mixed"로 표기하세요.
- 웹진·게임 전문 매체·뉴스 기사·보도자료의 평론/호평/비평은 긍정·부정 유저 동향 표본에 포함하지 마세요. 이 자료는 출시일·개발사·기능 등 사실 확인과 sources에만 사용할 수 있으며, sns_trend.overall·assessment·quick_pos·quick_neg·detail의 감성 근거로 쓰면 안 됩니다.
- 유저 의견 표본은 Steam의 실제 사용자 평가/리뷰, 유저가 작성한 커뮤니티 게시글·댓글, 사용자 리뷰, 영상 댓글처럼 개인 유저가 직접 남긴 발화만 사용하세요. 공식 계정, 인플루언서 광고, 언론사/웹진 기사는 제외하세요.
- 긍정·부정·복합을 합쳐 최대 50개의 서로 다른 확인 가능한 유저 의견만 조사하세요. 50건보다 많은 자료를 찾더라도 대표성이 있는 실제 유저 의견 50건까지만 분류하고, assessment.sample_counts.positive/negative/mixed의 합계는 절대 50을 넘기지 마세요. 각 값에는 실제로 읽고 분류한 개수만 0 이상의 정수로 넣고, 자료가 50건 미만이면 추측으로 채우지 말고 실제 개수를 적으세요. sample_counts.scope에는 실제 집계 사이트와 기간을 적으세요.
- 앱 마켓 순위는 국가별 순위인 경우가 많습니다. metrics.items의 "앱 마켓 순위"에는 scope에 반드시 "일본", "한국", "미국"처럼 국가명을 넣으세요. 글로벌 순위라는 공식 근거가 있을 때만 scope를 "글로벌"로 쓸 수 있습니다. 국가·지역을 확인하지 못하면 항목을 제외하세요.
- launch_signal은 반드시 작성하세요. 공식 출시일과 오늘 날짜를 비교해 phase를 정하고, 커뮤니티 게시글·유튜브 관련 영상은 실제로 확인·집계한 공개 표본의 수만 기재하세요. 정확한 전체 건수를 알 수 없으면 "확인 불가"로 쓰고 scope에 집계 사이트·기간을 적으세요. 숫자를 추측하지 마세요.
- 출시 1일차에는 게임 소개를 길게 쓰지 마세요. launch_signal.summary에서 먼저 데이터량과 주목도를 판단하세요. 데이터가 제한적이고 활동량이 적다면 "출시 1일차로 데이터가 충분히 쌓이지 않았으며, 수집한 공개 표본에서 커뮤니티 게시글 X개·유튜브 관련 영상 Y개가 확인돼 초기 유저 반응 및 주목도가 낮다"는 취지로 구체적으로 적으세요. 활동량이 충분하면 1차 분위기 판정과 주요 긍정/부정 의견을 함께 적으세요. 확인하지 못한 X/Y는 숫자로 채우지 마세요.
- sns_trend.assessment는 반드시 작성하세요. assessment.verdict와 overall에는 "긍정 우세", "부정 우세", "혼재" 중 하나를 넣고, decision_rule에는 실제로 적용한 종합 판정 기준을 적으세요. Steam 등급 하나나 긍정/부정 건수 하나만으로 종합 판정을 내리지 마세요. Steam 게임은 assessment.steam_rating에 Steam 공식 전체 평가의 등급·리뷰 수·긍정 비율·직접 URL을, assessment.user_trend에 Steam 최근 평가·추천 수가 높은 유저 리뷰·공감/댓글이 있는 커뮤니티 반응을 종합한 유저 동향 방향과 근거를 각각 적으세요. Steam 평가가 "Mixed/복합적"이어도, 신뢰도 높은 유저 동향이 뚜렷하게 긍정 또는 부정이면 최종 verdict는 "긍정 우세" 또는 "부정 우세"가 될 수 있습니다. 반대로 두 증거가 모두 엇갈리거나 근거가 약하면 "혼재"로 판정하세요. 댓글/공감이 없는 단일 게시글과 검색 결과 요약은 보조 참고일 뿐 우세 판정의 핵심 근거가 될 수 없습니다.
- assessment.summary는 반드시 "Steam 평가: [등급·핵심 수치] / 유저 동향: [긍정 우세·부정 우세·혼재와 신뢰 근거] / 종합: [최종 판정]" 순서로 작성하세요. 긍정 우세일 때는 전체 유저 동향이 긍정적인 이유와 일부 불만을, 부정 우세일 때는 주요 부정 이유와 일부 호평을 함께 적으세요. basis에는 Steam 평가와 유저 동향을 어떻게 함께 반영했는지 구체적 수치와 함께 적으세요. assessment.evidence에는 2~4개의 판정 증거를 source, reliability(높음/보통), direction, detail, url로 넣으세요. 첫 증거는 가능하면 Steam 공식 전체 평가여야 합니다. 뉴스·웹진·보도자료·인플루언서 콘텐츠의 호평/비평은 evidence, basis, overall, detail 어느 곳에도 감성 증거로 쓰지 마세요. 표본 수·공감 수·플레이 시간은 실제로 확인한 값만 적고 지어내지 마세요.
- Steam 게임은 sns_trend.steam_top_reviews도 작성하세요. Steam 공식 리뷰 페이지에서 정렬을 "가장 유용함"으로 두고, 실제 추천 수(도움됨/유용함)가 높은 서로 다른 일반 유저 리뷰를 최대 3개 선정합니다. 각 항목에는 sentiment(positive 또는 negative), summary(따옴표 없이 한국어 한 문장 핵심 요약), helpful_count(실제로 확인한 0 이상의 정수), playtime(확인한 경우만), 직접 리뷰 url을 넣으세요. 추천 수가 검증되지 않은 리뷰, 큐레이터·뉴스·웹진·인플루언서 리뷰는 절대 넣지 마세요. 긍정/부정을 균형 맞추기 위해 임의로 고르지 말고 추천 수 순으로만 고르세요. 3개를 확인할 수 없으면 확인한 개수만 넣고 steam_review_note에 이유를 적으세요. 추천 수·플레이 시간·리뷰 내용을 절대 지어내지 마세요.
- video_trend.points에는 영상/스트리밍에서 관찰되는 구체적 경향 2~3개.
- video_trend.official_pv에는 공식 유튜브 채널이 올린 PV·트레일러 링크를 1~2개 기재하세요. video_trend.review_videos에는 실제 리뷰·분석·첫인상 영상의 유튜브 링크를 2~3개 기재하세요. 각 항목은 title, channel, url을 포함하며 url에는 실제 https YouTube 영상 링크만 넣으세요. 검색 결과에서 실제 링크를 확인하지 못한 영상은 절대 추측하거나 채우지 마세요.

- Never write "Not available", "N/A", "확인 필요", or similar placeholders in metrics.items. If an applicable metric cannot be verified, omit it from items and add it to metrics.unavailable_items using its Korean label and a concise Korean reason, for example {"label":"Steam 매출 순위","reason":"출시 전이라 Steam 차트 데이터가 없어"}. The report will show a bottom note explaining that those items were excluded.
- For video_trend.official_pv, provide 1-2 verified HTTPS YouTube links from the official publisher/developer/game channel only. For video_trend.review_videos, provide 2-3 verified HTTPS YouTube links to independent review, analysis, or first-impression videos; do not use reuploads, shorts, search pages, channel pages, or fabricated URLs. Use an empty array when a verified link is unavailable.
- sns_trend.overall and sns_trend.assessment.verdict must be exactly one of "긍정 우세", "부정 우세", or "혼재". The final verdict must combine, not replace, two separate signals: assessment.steam_rating (official Steam category, review count, positive percentage, and actual URL) and assessment.user_trend (the direction supported by high-trust user feedback). A Steam "Mixed" category does not automatically force "혼재": when recent Steam reviews, helpful user reviews with verified engagement/playtime, and engaged user community evidence clearly point one way, the final verdict may be "긍정 우세" or "부정 우세". Use "혼재" when these signals conflict materially or trustworthy evidence is insufficient. assessment.summary must follow this exact order: "Steam 평가: ... / 유저 동향: ... / 종합: ..." and explain the final direction. assessment.evidence must contain 2-4 concrete signals with source, reliability (높음|보통), direction, detail, and an actual URL; include the official Steam review page whenever available. assessment.sample_counts are transparency context only, not the sole verdict rule. Count only direct user-authored feedback: Steam user reviews, user community posts/comments, user reviews, and video comments. Editorials, webzine/news articles, press releases, official accounts, and sponsored influencer content may be used for factual sources but never for sentiment counts, verdict evidence, basis, or sentiment detail. Inspect and classify at most 50 distinct user opinions in total. assessment.sample_counts.positive, .negative, and .mixed must be non-negative integers representing only the observations actually inspected, and their sum must never exceed 50. If fewer than 50 observations are available, report the actual count without estimates. Never fabricate review counts, post counts, likes, playtime, or engagement.
- For Steam games, populate sns_trend.steam_top_reviews with up to three distinct ordinary user reviews selected strictly by the highest verified helpful/recommendation count in Steam's "Most Helpful" order. Each item needs sentiment (positive or negative), a one-sentence Korean summary with no quotation marks, helpful_count as the verified non-negative integer, playtime only when verified, and the direct Steam review URL. Do not balance sentiments artificially: rank by helpful count only. Never use a curator, news, webzine, influencer, or a review whose helpful count cannot be verified. If fewer than three eligible reviews can be verified, return only those reviews and state the reason in steam_review_note. Never invent review text, helpful counts, playtime, or URLs.
- launch_signal must describe the launch phase, evidence sufficiency, observed community-post and YouTube-video activity, and an evidence-limited early trend summary. On release day, prioritize this signal over a generic game introduction. If observed activity is low or evidence is insufficient, explicitly say so rather than inferring a broad player sentiment.
- features must contain in-game playable systems only: combat, characters, progression, exploration, collection, multiplayer, controls, or other gameplay mechanics. Never include CBT schedules, login/invitation issues, beta data wipes, rewards, compensation, events, operations, monetization, or retention design in features.
- A favorable or unfavorable player reaction to service/reward/compensation/retention design belongs in sns_trend.detail with the correct sentiment. Factual test schedules and official operations belong in cbt_info, not features.
- All fields must be Korean except proper nouns and source titles.`;
  }

  function sanitizeJsonControlChars(str){
    let out = '';
    let inString = false;
    let escapeNext = false;
    for (let i = 0; i < str.length; i++){
      const ch = str[i];
      const code = str.charCodeAt(i);
      if (escapeNext){ out += ch; escapeNext = false; continue; }
      if (ch === '\\' && inString){ out += ch; escapeNext = true; continue; }
      if (ch === '"'){ inString = !inString; out += ch; continue; }
      if (inString && code < 0x20){
        if (ch === '\n') out += '\\n';
        else if (ch === '\r') out += '\\r';
        else if (ch === '\t') out += '\\t';
        else out += '\\u' + code.toString(16).padStart(4,'0');
        continue;
      }
      out += ch;
    }
    return out;
  }

  function extractJson(text){
    let t = text.trim();
    t = t.replace(/```json/gi,'').replace(/```/g,'').trim();
    const start = t.indexOf('{');
    const end = t.lastIndexOf('}');
    if (start === -1 || end === -1) throw new Error('JSON 형식을 찾을 수 없습니다');
    const candidate = t.slice(start, end+1);
    try{
      return JSON.parse(candidate);
    }catch(e){
      return JSON.parse(sanitizeJsonControlChars(candidate));
    }
  }

  // ---------- API call (pause_turn 대응) ----------
  async function callOpenAI(userMsg, isCbt, isUpdate){
    bumpProgress(25, 'OpenAI web search in progress');
    const response = await fetch('/api/report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        instructions: buildSystemPrompt(isCbt, isUpdate),
        input: userMsg
      })
    });
    const data = await response.json();
    if (!response.ok || data.error) throw new Error(data.error || 'OpenAI API request failed');
    if (!data.text || !data.text.trim()) throw new Error('OpenAI returned no text');
    return data.text;
  }

  // Legacy implementation retained below only as an inactive reference.
  async function callClaude(userMsg, isCbt){
    const messages = [{ role: 'user', content: userMsg }];
    const maxRounds = 6;
    let lastText = '';

    for (let round = 0; round < maxRounds; round++){
      bumpProgress(Math.min(20 + round * 15, 88), round === 0 ? '웹 검색 및 조사 중' : `조사 계속 진행 중 (${round + 1}라운드)`);

      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 8000,
          system: buildSystemPrompt(isCbt),
          messages: messages,
          tools: [{ type: 'web_search_20250305', name: 'web_search' }]
        })
      });

      const data = await response.json();
      if (data.error){
        throw new Error(data.error.message || 'API 오류가 발생했습니다');
      }

      const textInThisRound = (data.content || [])
        .filter(item => item.type === 'text')
        .map(item => item.text)
        .join('\n');
      if (textInThisRound.trim()) lastText = textInThisRound;

      if (data.stop_reason === 'pause_turn'){
        messages.push({ role: 'assistant', content: data.content });
        continue;
      }
      if (data.stop_reason === 'max_tokens'){
        messages.push({ role: 'assistant', content: data.content });
        messages.push({ role: 'user', content: '이어서 JSON을 끝까지 완성해줘. 지금까지 작성한 내용을 포함해 완전한 JSON 하나로 다시 출력해.' });
        continue;
      }
      return lastText;
    }
    return lastText;
  }

  async function generateReport(){
    const gameName = gameNameInput.value.trim();
    const dev = devInput.value.trim();
    const country = countryInput.value.trim();
    const hint = hintInput.value.trim();
    const searchPoint = searchPointInput.value.trim();
    const stage = getStage();
    const cbtName = cbtNameInput.value.trim();
    const updateDate = updateDateInput.value;
    const updateTarget = updateTargetInput.value.trim();
    const isCbt = stage === 'cbt';
    const isUpdate = stage === 'update';

    if (!gameName){
      statusText.textContent = '게임명을 입력해 주세요.';
      statusText.className = 'status-text err';
      return;
    }
    if (isCbt && !cbtName){
      statusText.textContent = '출시 전 게임은 이번 테스트 명칭을 입력해 주세요. (예: 한국 1차 CBT)';
      statusText.className = 'status-text err';
      return;
    }
    if (isUpdate && (!updateDate || !updateTarget)){
      statusText.textContent = '특정 업데이트/캐릭터 동향은 업데이트 날짜와 업데이트 내용 또는 캐릭터명을 모두 입력해 주세요.';
      statusText.className = 'status-text err';
      return;
    }

    generateBtn.disabled = true;
    statusText.className = 'status-text';
    statusText.textContent = '';
    progressWrap.classList.remove('hidden');
    startProgressSim();

    let userMsg = `게임명: ${gameName}`;
    if (dev) userMsg += `\n개발사: ${dev}`;
    if (hint) userMsg += `\n게임 특징 힌트(이 특징과 일치하는 게임인지 검색으로 반드시 확인): ${hint}`;
    if (searchPoint) userMsg += `\n서치 포인트(보고서에서 우선적으로 조사하고 답할 내용): ${searchPoint}`;
    if (country) userMsg += `\n검색할 지역: ${country}`;
    if (isUpdate){
      userMsg += `\n조사 모드: 특정 업데이트/캐릭터 출시 동향`;
      userMsg += `\n업데이트/출시 날짜: ${updateDate}`;
      userMsg += `\n조사 대상: ${updateTarget}`;
      userMsg += `\n매우 중요: 이 보고서는 '${updateTarget}'와 직접 관련된 내용만 다룬다. 게임 전체의 일반 정보·기존 평판·다른 업데이트/캐릭터 정보는 포함하지 않는다.`;
    } else if (isCbt){
      userMsg += `\n출시 상태: 출시 전 (테스트 진행 중)`;
      userMsg += `\n이번 테스트: ${cbtName} — 이 테스트에 대한 반응/정보만 수집할 것`;
    } else {
      userMsg += `\n출시 상태: 정식 출시`;
    }
    userMsg += `\n먼저 web_search로 이 게임을 충분히 조사한 뒤(최소 5회 검색), 지시된 JSON 스키마로 심층 보고서를 작성해줘.`;

    try{
      const fullText = await callOpenAI(userMsg, isCbt, isUpdate);
      if (!fullText.trim()) throw new Error('응답에서 텍스트를 찾을 수 없습니다');

      bumpProgress(95, '보고서 정리 중');
      const report = extractJson(fullText);
      report.generated_at = todayStr();
      report.stage_label = isUpdate ? `업데이트 · ${updateTarget}` : isCbt ? cbtName : '정식 출시';
      if (isUpdate){
        report.report_mode = 'update';
        report.update_target = updateTarget;
        report.update_date = updateDate;
      }
      if (!report.info) report.info = {};
      if (dev && !report.info.dev) report.info.dev = dev;

      const id = Date.now() + '_' + slugify(gameName);
      currentActiveId = id;
      currentReport = report;

      await saveReport(id, report);
      const list = await loadArchive();
      list.unshift({
        id,
        game: report.game || gameName,
        dev: report.info.dev || dev || '',
        date: report.generated_at,
        overall: (report.sns_trend || {}).overall || '혼재',
        stage: report.stage_label
      });
      await saveArchive(list);
      renderArchiveList(list);

      isEditing = false;
      renderReport(report);
      stopProgressSim('완료');
      statusText.textContent = '✓ 보고서 생성 완료 — [내용 수정]으로 검수 후 PDF로 저장하세요';
      formCard.classList.add('hidden');

    }catch(err){
      console.error(err);
      failProgressSim();
      statusText.textContent = '보고서 생성에 실패했습니다: ' + err.message + ' (다시 시도해 주세요)';
      statusText.className = 'status-text err';
    }finally{
      generateBtn.disabled = false;
      setTimeout(() => { progressWrap.classList.add('hidden'); setProgress(0,'대기 중'); }, 1500);
    }
  }

  generateBtn.addEventListener('click', generateReport);

  // ---------- standalone HTML export ----------
  function downloadShareHtml(report){
    if (isEditing){
      alert('먼저 [수정 완료]를 눌러 편집을 마친 뒤 공유용 HTML을 저장해 주세요.');
      return;
    }
    const clone = reportCard.cloneNode(true);
    clone.querySelector('.action-row')?.remove();
    clone.querySelector('.edit-banner')?.remove();
    clone.querySelector('#reportBody')?.removeAttribute('contenteditable');
    const styles = [...document.querySelectorAll('style')].map(style => style.textContent).join('\n');
    const page = `<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>${escapeHtml(report.game || 'game')}_동향보고서</title><style>${styles}\nbody{padding:20px;background:#F4F6F9}.report-card{max-width:1180px;margin:0 auto}.app,.main{max-width:none;padding:0;display:block}</style></head><body><main class="main">${clone.outerHTML}</main></body></html>`;
    const blob = new Blob([page], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${slugify(report.game)}_동향보고서_공유용.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---------- JSON export ----------
  function downloadJson(report){
    // 디자인 HTML 이식용: 구조화 데이터 전체 + 수정본 HTML 포함
    const exportData = { ...report };
    if (exportData.sns_trend && exportData.sns_trend.detail){
      exportData.sns_trend = { ...exportData.sns_trend, detail: sortDetail(exportData.sns_trend.detail) };
      // 사용자가 수정 모드에서 직접 순서를 바꾼 경우에는 그 순서(detail 배열 그대로)를 존중
      if (report.edited_html) exportData.sns_trend.detail = report.sns_trend.detail;
    }
    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${slugify(report.game)}_동향데이터.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---------- PDF export ----------
  async function downloadPdf(report){
    if (isEditing){
      alert('먼저 [수정 완료]를 눌러 편집을 마친 뒤 PDF로 저장해 주세요.');
      return;
    }
    const el = reportCard;
    const actionRow = el.querySelector('.action-row');
    if (actionRow) actionRow.style.visibility = 'hidden';

    try{
      // Split only at report section/card boundaries. The old exporter cropped one
      // tall image at arbitrary A4 heights, which split metric rows and cards.
      const exportCanvas = await html2canvas(el, { backgroundColor: '#FFFFFF', scale: 2 });
      const { jsPDF: PdfCtor } = window.jspdf;
      const exportPdf = new PdfCtor('p', 'pt', 'a4');
      const pageWidth = exportPdf.internal.pageSize.getWidth();
      const pageHeight = exportPdf.internal.pageSize.getHeight();
      const margin = 22;
      const contentWidth = pageWidth - margin * 2;
      const contentHeight = pageHeight - margin * 2;
      const pixelsPerPoint = exportCanvas.width / el.getBoundingClientRect().width;
      const maxSliceHeight = Math.floor(contentHeight * exportCanvas.width / contentWidth);
      const elTop = el.getBoundingClientRect().top;
      const breakPositions = selector => [...el.querySelectorAll(selector)]
        .map(node => Math.round((node.getBoundingClientRect().top - elTop) * pixelsPerPoint))
        .filter(y => y > 0 && y < exportCanvas.height)
        .sort((a, b) => a - b);
      const sectionBreaks = breakPositions('.section');
      const cardBreaks = breakPositions('.feature-item, .detail-item, .trend-box, .overview-box, .cbt-table');
      const bestBreak = (breaks, from, max) => breaks.filter(y => y > from + 20 && y <= max).pop();

      let sourceY = 0;
      let pageNumber = 0;
      while (sourceY < exportCanvas.height){
        const maxY = Math.min(sourceY + maxSliceHeight, exportCanvas.height);
        let cutY = bestBreak(sectionBreaks, sourceY, maxY);
        if (!cutY) cutY = bestBreak(cardBreaks, sourceY, maxY);
        if (!cutY || (cutY - sourceY) < maxSliceHeight * 0.38) cutY = maxY;
        const sliceHeight = cutY - sourceY;
        const slice = document.createElement('canvas');
        slice.width = exportCanvas.width;
        slice.height = sliceHeight;
        slice.getContext('2d').drawImage(exportCanvas, 0, sourceY, exportCanvas.width, sliceHeight, 0, 0, exportCanvas.width, sliceHeight);
        if (pageNumber > 0) exportPdf.addPage();
        exportPdf.addImage(slice.toDataURL('image/png'), 'PNG', margin, margin, contentWidth, sliceHeight * contentWidth / exportCanvas.width);
        sourceY = cutY;
        pageNumber += 1;
      }
      exportPdf.save(`${slugify(report.game)}_trend_report.pdf`);
      return;

      if (false){
      const canvas = await html2canvas(el, { backgroundColor: '#FFFFFF', scale: 2 });
      const imgData = canvas.toDataURL('image/png');
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p', 'pt', 'a4');
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      const imgWidth = pageWidth;
      const imgHeight = canvas.height * imgWidth / canvas.width;
      let heightLeft = imgHeight;
      let position = 0;

      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;

      while (heightLeft > 0){
        position = heightLeft - imgHeight;
        pdf.addPage();
        pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;
      }

      pdf.save(`${slugify(report.game)}_동향보고서.pdf`);
      }
    }catch(e){
      console.error(e);
      alert('PDF 생성에 실패했습니다: ' + e.message);
    }finally{
      if (actionRow) actionRow.style.visibility = 'visible';
    }
  }

  // ---------- init ----------
  updateStageUI();
  refreshArchiveList();

})();
